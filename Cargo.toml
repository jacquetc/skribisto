[profile.dev]
# Debuginfo, not the linker, was the dev loop's biggest single cost. Measured on
# 2026-08-27 (24 cores, warm, uncontended): editing one leaf file in `teksilo_ui`
# cost 8.89 s to `cargo build` but only 3.80 s to `cargo check` — and the build's
# `sys` time was 9.40 s against 10.58 s `user`, i.e. the second half of the loop
# was I/O, not compilation. The cause was on disk: under Cargo's default
# `debug = 2` the `teksilo_ui` rlib was **1.24 GB** and the debug binary **1.08 GB**,
# `target/debug` had reached **138 GB** on a 97%-full disk, and rustc was reloading
# and rewriting a **2.3–2.8 GB** incremental dep-graph on every edit however small.
#
# `line-tables-only` keeps exactly what a writer's bug report needs — `file:line`
# in panic messages and backtraces — and drops only the variable/type information
# a *step-debugger* wants. If you need to run this under gdb/lldb, don't edit this
# line: override the one crate under inspection instead, e.g.
#
#     [profile.dev.package.teksilo_ui]
#     debug = 2
#
# `split-debuginfo = "unpacked"` then leaves that reduced DWARF in the object
# files beside the binary rather than copying it into the executable at link time.
#
# Verified NOT to be the cause, so don't re-investigate: `tr!` (2,616 invocations,
# but `teksilo-i18n-macros` caches the parsed `.ftl` in a `OnceLock` per rustc
# process) and monomorphization (teksilo's widgets are type-erased — `HStack` is
# a plain non-generic struct over `Box<dyn Widget>`).
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.release]
lto = "fat"
strip = true
codegen-units = 1
# `panic` is deliberately left at Cargo's default (`unwind`).
#
# `panic = "abort"` used to sit here, and it silently disabled the app's only
# production crash-isolation boundary: `common::long_operation`'s
# `catch_unwind`, which exists so a panic inside a long operation (save_work,
# save_as, backup_now, export_work, analyze_book, scan_mentions, count_words,
# import_plume_creator_file) is reported as `Failed` instead of killing the
# process. `catch_unwind` cannot intercept an abort, so under that setting a
# panic mid-save took down every open Work's window in this single-instance,
# multi-window process — with the writer's unsaved prose.
#
# The contract is tested (`work_management::save_load_test::
# panicking_long_operation_is_reported_failed_not_stuck`), but Cargo forbids
# `panic = "abort"` for the test profile, so the suite ran under `unwind` and
# proved a behaviour the shipped binary did not have. Same for the store's
# poison recovery (`hashmap_store::{read,write}_or_recover`): a poisoned lock
# requires an unwind past a held guard, so under `abort` that machinery was
# unreachable in release too.
#
# See also `common::database::write_guard::WriteTransactionGuard::acquire`,
# which already states the house rule this restores: "a shipped build should
# degrade to a reported failure, not abort the process."

[workspace.lints.rust]

[workspace.lints.clippy]
# Qleany-generated code (entity DTOs, controllers, units of work) pervasively
# `.clone()`s `Copy` fields — defensive templates that compile for both `Copy`
# and non-`Copy` types — and binds unit-returning calls to `let`. Both trip
# clippy under `-D warnings`. Those files are regenerated and MUST NOT be
# hand-edited (see the project guide), so the two generator-produced lints are
# allowed workspace-wide rather than fought file-by-file. Hand-written crates
# almost never hit them.
clone_on_copy = "allow"
let_unit_value = "allow"

# Panic hygiene (`clippy::unwrap_used` / `expect_used` / `panic`) is enabled
# **per crate**, not here, as a ratchet — see the `#![warn(..)]` preamble in each
# clean crate's `lib.rs`.
#
# It cannot go in this table: CI lints with `--all-targets -- -D warnings`, and
# the integration tests under `crates/*/tests/` are separate targets full of
# deliberate `unwrap()`s. `clippy.toml`'s `allow-unwrap-in-tests` exempts
# `#[test]` functions but not the plain helper `fn`s those files build on, so a
# workspace-wide switch turns ~250 test-only lines into hard CI failures while
# saying nothing about shipping code.
#
# Enabling it crate-by-crate keeps the guarantee real and green: the crates that
# carry it today are at zero, so any *new* panic path in them fails CI. Add the
# preamble to another crate as it comes clean; `direct_access` went from 316
# sites to zero, so this list is expected to grow, not stay put.
#
# It only goes in a `lib.rs` that survives regeneration — a hand-written crate
# (`binder_ordering`, `skribisto_model`, `skribisto_compiler`, `skribisto-fonts`),
# one already hand-maintained for other reasons (`search_management`), or a
# generated one whose *template* carries it (`direct_access`, `macros`, patched in
# the sibling qleany repo). Putting it in an otherwise pure-generated `lib.rs`
# looks identical and works right up until the next `qleany generate` silently
# deletes it — a ratchet that quietly unlatches is worse than no ratchet.

