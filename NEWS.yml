Version: 3.5.1
Date: 2026-11-25
Type: stable
Description:
- "Settings ▸ Editor ▸ Synopsis has a new choice, Text color. Dimmed writes synopses in the softer color they have always had, so they read as notes beside your text. Normal writes them in the same color as your text, which is easier to read for long. The corkboard keeps the normal color as before, on its cards and in a card you open"
- "Epigraphs are now in the same color as your text. They were in the softer color of synopses, though an epigraph is part of the book. With Read as exported on, the synopses a style prints are in the text's color too, as the export shows them"
- "In distraction-free mode, your text and the cursor are now in the text color of the theme you chose. They kept the color of the app's light or dark theme instead, so the theme's own color reached the strip at the bottom but not your words: under Midnight they were grey rather than white, and under Sepia black rather than brown. A synopsis set to Normal follows the theme's text color too"
- "Emptying the trash no longer deletes a scene you can see. If you trashed a scene and then its chapter, undoing that or restoring the chapter brought the scene back too while it stayed in the trash, and Empty trash then deleted it. The scene now stays in the trash until you restore it, and restoring it while its chapter is still in the trash asks where to put it. The same goes for trashing a selection or a whole binder"
- "Save as folder now refuses a folder that already holds another project or other files, and says so. It used to write into that folder and delete the other project's binders, texts and history"
- "A folder project whose comments, footnotes or tags file cannot be read now refuses to open and names the file. It used to open without them, and the next save deleted the file"
- "A folder project kept in a git repository, or holding hidden files such as .DS_Store, no longer copies them into every save, backup and Save as. The whole .git folder used to be read at each autosave, and could be written back out of date"
- "Files that a newer Skribisto or an extension keeps in a binder's folder now follow the binder when you rename or move it. They used to be deleted with the old folder"
- "If Skribisto stops in the middle of saving a folder project, the project still opens. Renaming a scene, a note template or a picture, or deleting a binder, could leave a project that refused to open"
- "A file stored in a project's resources now survives when Skribisto repairs its identifier as the project opens. The project used to fail to open, and the file was deleted"
- "Importing a Manuskript project folder, or an old Plume Creator project folder, no longer reads files that are links to somewhere else, or special files that could freeze the import. A link inside a project someone sent you could pull an unrelated file from your computer into your book. Each file left out is named in the import summary"
- "Importing a Manuskript scene that holds a long run of curly braces no longer stalls the import"
---
Version: 3.5.0
Date: 2026-11-25
Type: stable
Description:
- "Everything but what you are writing can now fade back. Press F8, click the new button beside the spell-check one at the top right, or choose View ▸ Fade the rest of the text. In Settings ▸ Editor ▸ Focus you choose whether the sentence or the whole paragraph you are in keeps its full strength, and how far the rest fades: Light, Medium or Strong. In Full Chapter, Full Part and Full Book the other scenes fade as well, and so does the synopsis while you write the text below it. It works in distraction-free mode too, where the strip at the bottom has its own button, and it combines with Highlight around the caret and with typewriter scrolling"
- "Paragraphs can now be justified. Justify sits beside Align left and Center in the Format panel and in Format ▸ Alignment. A justified paragraph stays justified in DOCX, ODT, EPUB, HTML and PDF exports, even when the export style sets the book ragged, so you can justify one passage, such as a letter, without justifying the whole book"
- "Settings ▸ Editor ▸ Scene, Synopsis and Notes each have a new switch, Start justified. When you start writing in an empty text of that kind, its paragraph is justified, and so is each paragraph you add after it with Enter. Texts that already hold words keep their alignment, and Undo right after the first letter takes the justification off"
- "The lists that open from Convert to…, Add to cast…, Set point of view…, File under a book… and Link to a note… now sit in a single frame. They used to show a frame inside a second, wider one"
- "A DOCX export whose style justifies the text now marks its paragraphs justified the way Word reads it. The file used a value outside the DOCX standard, which word processors could ignore and show the text ragged"
- "In the Resources panel, a folder's Resources page and Settings ▸ Work ▸ Resources, each file now shows its extension on a small coloured tag beside its size, such as pdf or docx. A title is the file's name without its extension, so two files called Map looked alike but for their icon. The colour comes from the extension: a PDF is red, a Word document blue, and files of the same type always share theirs"
- "Scenes and chapters no longer share an icon shape. A scene now shows the three marks that separate scenes in a printed book, * * *, above two lines of text, and a chapter shows a page whose top is filled in, like the title area of a chapter's first page. They used to be the same page with a small difference inside it, which was hard to tell apart in the editor tabs. The new icons appear in the binder, the editor tabs, the corkboard, the Overview, the Search panel, the Trash, Go to, the destination pickers and Export"
- "Renaming a chapter or a part that had no title now shows the new title in Full Part, Full Book and Full Synopsis straight away. These pages kept the name Skribisto gives an untitled chapter, such as Chapter 3, and switching to another page and back did not always bring the new title. Clearing a title now shows that name again instead of an empty heading"
- "Add new chapter, at the end of Full Part and Full Book, now adds a chapter after the last one. It used to add a scene to the last chapter, in a window titled New scene. The windows that Add new chapter, Add new scene, Insert chapter and Insert scene open, on the corkboard too, now carry the name of the button you clicked. Clicking OK with no name now adds the item anyway: a chapter then has no title of its own and is numbered like any other, and a scene is called New scene. It used to do nothing, as if you had clicked Cancel"
- "On the corkboard, Insert on a note card now reads Insert note, on a front or back matter card Insert paratext, and on the end of a book Insert book. It said Insert scene on every card that was not a chapter, whatever it then added"
- "Full Synopsis now always shows the synopses. After turning on Read as exported in Full Book, Full Part or Full Chapter, switching to Full Synopsis used to show the exported text instead, with no switch on that page to turn it off. Read as exported stays on and applies again when you switch back"
- "In the margin marks, the dialogue texture now follows the text when its lines wrap differently, after the window is resized for example. A paragraph's bar could stay a line away from its paragraph until the next edit to that scene"
- "Full Book, Full Part, Full Chapter and Full Synopsis now show their outline: each chapter sits further in than its part, and each scene further in than its chapter. Choose how far in Settings ▸ Editor ▸ Page layout ▸ Indent by level, from None to Large. With a screen reader, each title is a heading one level below the one it belongs to"
- "Full Book and Full Part, and their Full Synopsis, can now show only their outline: choose Show down to chapters or Show parts only above the text. A banner says what is hidden, and adding, moving, merging and splitting wait until everything is shown again. Each tab remembers its choice"
- "Turning Read as exported on or off at the top of Full Book, Full Part or Full Chapter now leaves the page where it was. It used to scroll down to the first part, chapter or scene, out of sight of the switch you had just used"
- "Help ▸ Report a Translation Error… has a new button, Continue on Discord, for writers without a GitHub account. It copies your report and opens the project’s translation channel on Discord, where you paste it into a message. The text under What will be public now offers it, and so does the help page"
- "Right-clicking a scene, chapter or any other item in the binder now offers Set label, as the corkboard and Full Chapter already did. Right-click one of several selected items to label them all at once; one Undo then gives each back the label it had. Leave the field empty to remove a label"
- "After changing a label, in the binder, on the corkboard, in Full Chapter or in the Overview, Edit ▸ Undo now reads Undo changing the label. It used to read Undo renaming"
- "In Danish, Nummerér ikke dette kapitel in the binder's right-click menu now has U as its access key. It shared I with Importér her…, so the key could not reach both"
- "Settings ▸ Editor ▸ Editor Behavior had grown too long and is now four pages. Page layout holds the text width, Indent by level, and where the synopsis and the epigraphs go. Focus holds typewriter scrolling, Highlight around the caret and Fade the rest of the text. Images & files holds what happens to large images you insert and to files over 10 MB you attach. Tabs kept open and Remember the last view for each item type are on a new page, Appearance & Behavior ▸ Tabs & views. Every setting keeps its value"
- "Settings now opens on the page you were on last, instead of always on Appearance. A message that offers to open one page of Settings, and Help ▸ Keyboard shortcuts, still open on their own page"
- "Undoing a move, a merge, a split or a duplicate in the binder now keeps the words you typed after it into a text that was still empty, such as a chapter's own text, a synopsis or an epigraph. The undo used to remove that text along with what it undid"
- "In Search, the matches found in comments now start unticked for Replace All, as the Comments switch says. They started ticked whenever the search had just been run, so a Replace All changed your comments too unless you unticked each one"
- "In Search, Replace this on a match you have not ticked, such as one in a comment, now replaces it. It used to change nothing and say nothing. And the question Replace All asks now counts only the matches it will change, not the unticked ones"
- "In the Versions panel, Restore this version now refuses an item in the trash, whose text cannot be changed anywhere else: restore the item from the trash first. It used to rewrite the text of the trashed item"
- "Every item that holds text now has a scratchpad, a page of private notes kept beside its text, for a question to settle, a fact to check or a list of changes for the next draft. Open it on the right of the window with its icon or Ctrl+Shift+A, or from View ▸ Panels. It shows the scratchpad of the item in front of you, and in Full Book, Full Part, Full Chapter and Full Synopsis that of the scene your cursor was in last. A scratchpad is saved and backed up with the project, but never exported, never counted in your words, targets or pace, and left out of Search unless you turn on the new Scratchpads switch among its options. With it on, their matches are listed unticked, as comments are, Replace All changes the ones you tick, and opening one selects it in the scratchpad. An item in the trash keeps its scratchpad, read-only, and merging two scenes joins theirs. Its earlier versions are in the Versions panel: choose Scratchpad at its top to compare them or put one back. Settings ▸ Editor ▸ Typography ▸ Scratchpad, a new page, sets its font and text size apart from those of your notes, and Ctrl+= in a scratchpad resizes only scratchpads"
- "Importing from Scrivener, Manuskript or Plume Creator now puts the notes of each document, scene, chapter or folder into that item's own scratchpad. They used to arrive as a separate note titled with the item's name and (notes), placed next to it in the binder. Scrivener notes holding footnotes or comments, which a scratchpad cannot show, still arrive as that note, and the import says so. In Manuskript notes, the names of characters, world entries, plots and other items are written out as before, but no longer linked: the import says how many items this concerns"
---
Version: 3.4.1
Date: 2026-11-23
Type: stable
Description:
- "A story bible entry's In prose page now says what it shows. Its counter reads “206 mentions in your confirmed scenes”, an empty page explains that only the scenes where you placed the entry in the cast or the point of view appear there, and a link, “Review 3 suggested scenes in Details”, opens the scenes of that Book that name the entry without having it in their cast. It used to say only “Not declared in this Book yet”, which read like a search that had found nothing"
- "In prose has a new switch, Viewpoint scenes only, which keeps the scenes told from the entry's point of view and sets aside those it only appears in. It shows when a Book holds both kinds"
- "After importing from Scrivener, the note about entries that still have a template's title, such as “Hero”, now says that the scenes naming them are suggested in each entry's Details. It used to say they were all listed under In prose, which only shows confirmed scenes"
- "In the Starforgers example, every chapter has its own synopsis, cast and point of view again. They had slipped five rows: Chapter 1 showed the synopsis and cast of Chapter 6, and the copyright and dedication pages carried those of the Prologue and Chapter 1"
- "When the search or the tag and status filters hide every picture of a folder, the Gallery now says No images match these filters and offers Clear the filters, which clears them in the Overview too. It used to say No images here yet, as if the folder had none"
- "An empty Gallery offers Add images…, and takes images dropped from your file manager. They become resources of the folder and appear in its Gallery at once"
- "The Resources panel has a choice at its top, This item or Unattached. Unattached lists the files and links attached to no item, which only Settings ▸ Work ▸ Resources showed, and is a place for research you have not filed yet: what you add there, with the buttons, a drop or Ctrl+V, is attached to nothing. Attach to items… puts one on items, and dragging it into a text, or inserting a link to it, attaches it to that text's item"
- "Full Book, Full Part and Full Chapter have a new switch, Read as exported, which shows the book as your reader will get it in the export style chosen beside it: scenes with Include in exports turned off disappear, the dedication and the other front and back matter appear, each chapter opens on the heading the export prints with its epigraph, and scenes run on into each other unless a scene break separates them. A line marks each new page. The text stays editable, and the status, tags and menus of each scene are hidden. Fonts and pages are not shown"
- "Each book now remembers its export style. The Export window opens on the style it was last exported with, and Read as exported follows it"
- "In Full Book, Full Part and Full Chapter, a scene with Include in exports turned off says Not exported beside its title. It looked like every other scene, so a cut scene was easy to read as part of the book"
- "The synopsis above the text now folds away when you click its title, like the epigraph, and each item remembers whether you folded it, after a restart too. A new switch in Settings ▸ Editor ▸ Editor Behavior, Start with the synopsis folded, folds it on every item you have not folded or unfolded yourself"
- "The synopsis beside the text, folded with its button or by dragging its divider, is now remembered for each item as well. It used to open again on every item"
- "Settings ▸ Editor ▸ Editor Behavior has a new switch, Show epigraphs. Turned off, part and chapter pages no longer show the epigraph field. The epigraphs you have written are kept and still appear in your exports"
---
Version: 3.4.0
Date: 2026-11-23
Type: stable
Description:
- "Resources: attach files and web links to any item of your project, a map of the village, a photograph, the recording of an interview, a page on the web. They are listed in a new panel on the right, Resources (Ctrl+Shift+X), which shows those of the item you are on. Add files with its + button or by dropping them from your file manager, and web links with its globe button, by dropping an address from your browser, or with Ctrl+V. Each row shows the file's type, a preview for a picture, its size or its address, and says Not found when a linked file is not where it was"
- "A file larger than 10 MB asks before it is added: store it in the project, where it travels with every copy and every backup, or link to it where it is. Don't ask again keeps your answer"
- "Settings ▸ Editor ▸ Editor Behavior has a new choice for those files: Ask each time, Always store in the project or Always link to the file. Reset to defaults brings the question back"
- "Double-click a resource to open it in the application your system uses for that kind of file, a picture in the image viewer and a web link in your browser. A file that could start a program, such as a script or an installer, asks first and offers Show in folder instead, since a project can come from someone else"
- "Change a stored file in another application, a map you annotate or a recording you trim, and Skribisto takes the new version into the project when you come back to its window, before each save, and when you close the project. In a project kept as a single file, a notice says so and offers Undo. Such a project opens its files as copies, which are removed when it closes"
- "Drag a resource into a text to link to it there. A picture asks whether to put the picture itself in the text or a link to it. Ctrl+click on such a link opens the resource, and an export prints only the link's words"
- "A file that is not a picture, dropped on a text, becomes a resource of that item, linked where you dropped it. The notice that says so offers Undo, which takes back both the resource and the link, or neither when you have typed before the link since, and says so"
- "Drag a resource onto an item in the binder to attach it to that item too, or choose Attach to items… in its menu to pick several items in the binder. A resource dropped in a text is attached to that text's item"
- "In a resource's menu, Locate… finds a linked file that moved, and links again any other missing file from the same folder found in the new one. Rename and describe… gives a resource a title and a description of its own. Detach from this item takes it off the item, and Remove from the project takes it out of every item"
- "Removing a resource from the project, or detaching it from an item, shows a message with Undo, which brings it back as it was"
- "Every folder has a new view, Resources: the files and web links attached to the folder and to everything inside it, each listed once with the items it is on, as a list or as a grid of tiles. Click an item's name to open it. Files and links added there, or dropped on it, are attached to the folder. A plain folder, which showed only its synopsis, now has a bar with two views, Folder and Resources"
- "Settings ▸ Work has a new page, Resources, for the files and links attached to no item any more: attach them to items chosen in the binder, export copies of them to a folder, or remove them from the project. It also says how much room the project's stored files take, and offers a single-file project past 100 MB to be saved as a folder, which saves faster"
- "A project kept as a single file whose stored files pass 100 MB offers, once, to be saved as a folder instead, which saves only what changed"
- "The Gallery shows the picture resources of its notes too, after the pictures in their text, marked Resource, and those of the folder itself first. They open in the image viewer with the others, and a right click offers the Resources panel's menu. A search in the Gallery also finds a picture resource by its title, file name or description"
- "Global search has a new switch, Resources, on by default: it finds resources by their titles, descriptions, file names and web addresses, under each item they are attached to. A replace never changes them"
- "The Help window has a new page, Files and links for your research"
- "Importing a Scrivener project now brings the files of your research inside the new project: pictures, PDF files, sounds and web pages become resources of the folder they sat in, or of their own note when they had a synopsis, notes or keywords. A plain text file still becomes a note holding its words. In your manuscript, a picture stays a note showing it, and any other file becomes a resource of its note. Nothing is copied beside the new project any more, so that choice is gone from the Save page"
- "Before a Scrivener import, the review page says how many research files the new project will hold and how much room they take. A file that cannot be read, or is larger than 512 MB, stays in your Scrivener project, and the import's report names it"
- "Scrivener bookmarks to web pages and to files on your computer come across as link resources of the document that held them, and the project's own as resources of the project. They used to be lines in the notes of the From Scrivener folder"
- "A picture wider than its text is drawn at the width of the text, its height in proportion, in every text. It used to keep its own size and run past the right edge, which is how screenshots imported from Scrivener often looked. Nothing in the project changes: widen the window, or the column, and the picture grows back up to its own size. Resize the image now works from the size you see: 50 halves it"
- "Double-click a picture, or choose View the image in its menu, to open it in the new image viewer: as large as the window allows, with Zoom in, Zoom out, Fit and 100 %, Ctrl and the mouse wheel to zoom where you point, a pinch on a trackpad, and a drag to move around a large picture. The arrow keys go to the text's previous and next pictures. Save a copy… writes the picture to a file under its original name, and Open in another app opens it in your system's picture application"
- "On a Book's page, View beside the cover, or a double click on it, opens the cover in the image viewer"
- "A notes folder has a new view, Gallery: the pictures of its notes as thumbnails in columns, each keeping its proportions. First image shows one per note with the number of its other pictures, All images shows every one. Nested shows each subfolder as a tile with its first four pictures, Flat shows the pictures of every subfolder at once, and Notes without images adds the text notes as tiles of their opening words. The Image size slider makes the thumbnails smaller or larger"
- "The Gallery and the Overview share their search, their tag and status filters and their order. A double click on a thumbnail opens the image viewer over the pictures the Gallery shows, in its order; a right click offers Open the note"
- "The Help window has a new page, Pictures and the gallery"
- "In global search, choose Open in editor from a result's menu, or middle-click the result, to open it in the active editor pane, scrolled to the match with the matching text selected"
- "A note that is a story bible entry, because it carries a tag with Find in prose turned on, shows a solid note icon instead of the outlined one: in the binder, the editor tabs, the corkboard, the Overview, the Trash, Go to, the destination pickers and Export. Turning Find in prose on or off for a tag changes the icon of every note carrying it at once, and a screen reader announces such a row as a story bible entry"
- "A notes folder has an icon of its own, a folder holding a solid note, instead of the note icon it shared with the notes inside it: in the binder, the editor tabs, the Overview, the Trash, Go to, the destination pickers, Export, the Create menus and Convert to"
- "A click in the empty page around a text now puts the cursor in it: in the margin beside a line, at the start or the end of that line; under the text, at its end. A tap with a finger does the same. With a short text, a click on the empty part of the page used to do nothing"
- "With the editor split in two, a click anywhere in a half, even on its margin or under its cards, makes it the active half, and the panels on the right show its item. A click used to count only when it put the cursor in a field. The cursor stays where it was"
- "In the New Work window, the Tags, Workflow and Note templates choices have a page of their own, Organization, after Template, where they no longer sit below the fold. Each now says what it creates, right under its list: the tags of the chosen palette, the stages of the chosen workflow and the templates of the chosen set"
- "In the New Work window, No tags, No templates and No structure are now in their lists, so a choice made there can be taken back. Once a palette, a set of templates or a book structure had been picked, there was no way back to none but to cancel the window"
- "A spelling dictionary found on your computer but not offered for download, such as Esperanto in /usr/share/hunspell, can now be chosen as the language of a project or a scene. It used to appear under Settings ▸ Dictionaries ▸ Installed, sometimes marked unusable, and was missing from the list of languages. It is listed by its own name and code, Esperanto (eo), so English (en-ZA) and English (en-IE) can be told apart"
- "Opening and saving a project with many pictures takes far less memory. Every save used to read all of the project's pictures into memory, and a single-file project was unpacked into the system's temporary folder, which on many Linux systems is memory too. Pictures are now copied straight from file to file, and a single-file project is unpacked into Skribisto's own data folder on disk"
- "A project kept as a folder and saved as a single file with Save As keeps its pictures. The first save of the new file used to look for them in the wrong place and leave every one of them out"
- "A project kept as a folder is never read or saved through a symbolic link any more. A scene, a list of the project or a footnote file that is a link to a file elsewhere stops the project from opening, and the message names it; a linked picture, stored file, comment or history entry is left out with a warning. Before, the file the link pointed at was read in, and a copy or a backup of the project carried it along"
- "On the corkboard, the tooltips of Nested and Flat say what each one shows, and Settings ▸ Corkboard says that Flat shows everything in the container, folder cards included, in reading order. They only said that the choice applies to every corkboard, and that Flat showed every scene"
- "The About page of the Launcher now shows what Help ▸ About shows, and both show more: links to the source code, Discord and the place to report a problem, the libraries and fonts Skribisto is built with, and the full text of each licence, all readable without a connection. The Launcher's page used to hold a single line"
- "In About, What's new in this version opens this version's release notes, in English, and Copy version info puts the version, the system and how Skribisto was installed on the clipboard, ready to paste into a bug report"
---
Version: 3.3.3
Date: 2026-11-19
Type: stable
Description:
- "Text on screen is drawn better, everywhere in Skribisto. Letters are as dark as in a web browser: the edges of each letter used to come out about a quarter lighter, so text looked grey and thin, and in a dark theme light text looked heavier than in other applications. Letters are evenly spaced: each one used to be placed on the nearest whole pixel, so the gap between two letters could be a pixel off and words seemed to run together. And when your desktop's font settings ask for medium or full hinting, in KDE Plasma or GNOME, text is now drawn sharp, fitted to whole pixels as Windows draws it"
- "Settings ▸ Appearance has a new choice, Text contrast: Standard, Stronger or Strongest. It sets how dark the edges of letters are drawn, in every window at once. Standard is the browser-like rendering described above; the other two help when text still looks grey or thin"
- "Settings ▸ Appearance also has Text rendering: System, Smooth or Sharp. Sharp puts each letter on whole pixels, as Windows draws text, for crisper letters at the cost of slightly wider lines; Smooth keeps each font's exact shapes, as a web browser does. System, the default, is sharp when your desktop's font settings ask for medium or full hinting, and follows them when they change; while it is chosen, its button says which of the two your desktop gives"
---
Version: 3.3.2
Date: 2026-11-17
Type: stable
Description:
- "On a note's Details page, each scene listed under “Appears in the manuscript” has an Add to cast button that answers a click. It used to be a bare tick that only Tab could reach: clicking it opened the scene beside instead. Confirm every appearance, below the list, is now called Add to every cast. The plus and the cross beside each name of a scene's cast in the Inspector answer a click again too"
- "In that list, a light frame appears around a scene when the mouse is over it, and a stronger one around the scene Tab is on, with room around its title and its quotation. Nothing showed under the mouse, and the Tab frame was drawn over the words"
- "Help ▸ Report a Translation Error… finds a wrong word in your language by the words you saw, in menus, messages, help pages and exported books, and turns it into a report for the translators: what is wrong and how it should read. It opens a public report on GitHub in your browser, already filled in; Skribisto itself sends nothing. The same window opens from the Learn page of the Launcher, under the language choice in Settings ▸ Appearance, and from the foot of every help page in your language"
- "The Help window has a new page, Reporting a translation error"
- "Arabic or Hebrew typed into a one-line field, such as Search or a rename box, now shows, and reads right to left from the right edge, even in a French or English interface. It used to be invisible. In the Arabic and Hebrew interfaces, Latin text typed into such a field reads left to right. A link's address and the file path of a Manuskript or Scrivener import always read left to right"
- "Settings ▸ Editor ▸ Editor Behavior has a new choice, Tabs kept open: One, Last five or All. With One, each item you open replaces the tab you were on. With Last five, opening a sixth closes the tab you have gone longest without looking at. Pinned tabs never count and are never closed, and a tab whose text could not be saved stays open. All, the default, keeps every tab as before"
- "Your writing now tells a screen reader which language it is in: a scene, a note, a synopsis, a title, a comment or a footnote is announced in the language set for it in the Inspector, or else the project's, while the menu bar, the panels and their buttons keep the interface's. A screen reader that switches voices can then read an English novel in an English voice inside a French interface. A help page shown in English because it is not translated yet is announced as English, and in Report a Translation Error the better translation is announced in the language being reported"
---
Version: 3.3.1
Date: 2026-11-11
Type: stable
Description:
- "Opening a text's menu with Shift+F10 or the Menu key leaves the cursor where it was. It used to jump to the middle of the text, so Paste landed there"
- "Alt+Up and Alt+Down move the selected binder item up or down, and Alt+Down opens a list or a date field. Those keys used to go to the previous or next item from anywhere in the window; they now do that only while you write in a text"
- "Go ▸ Next scene, Alt+Down and the other Go commands put the cursor in the text they open, so you can go on writing at once. It used to stay on the page you left, and a screen reader announced only the window"
- "In the Help window, Enter on a topic, the Back button and a link to another page take you into the page's text, and a screen reader announces the page's title as its heading. Focus used to stay on the topic's button, with no sign that the page had changed"
- "In Settings, Enter on a page in the list on the left, a link to a page, a page in the breadcrumb at the top or a search suggestion takes you to that page's first setting. Focus used to stay where it was, and was lost when that was on the page being left"
- "Every on/off setting in Settings has its name on the left and its switch on the right, as most pages already did. Some pages put the switch first, and periodic backups now take two lines: one to turn them on, one for the interval"
- "With a screen reader, the search fields in Settings, the binder, Search, the corkboard, the overview, Go to and the Launcher, the editable lines of the tags, statuses, templates, dictionary and text replacement pages, the fields that add a holiday or a milestone in Pace, and the bar of views at the top of a chapter, a part or a book now have names. They used to be announced with none, or by their grey hint until something was typed"
- "Help ▸ Keyboard shortcuts opens Settings on its Keyboard shortcuts page, where every shortcut can be found and changed, in the Launcher too. It used to open a small sheet whose list the keyboard could not reach, and whose button did nothing in the Launcher. A Settings window opened for one page, from a message or a menu, now starts on that page's first setting"
- "A screen reader announces the Help window as “Help - Skribisto” and each page by its title. They used to be “Skribisto” and an unnamed document"
- "In the Help window, the short definitions under “What things are” open as pages you can enter and read with the keyboard, like the other topics. Their text used to be out of reach of Tab, and of Enter on the topic"
- "With a screen reader, each line of the tags, statuses, note templates, dictionary and text replacement lists in Settings is announced by what it holds: the name of the tag, the status or the template, the word, or the shorthand and what it becomes. A tag used to be announced by its colour, a status by its number, and every word and every rule by the same field name"
- "With a screen reader, the charts in Go back in time, in a book's Pace and in its Analysis are announced by their titles. They were announced in English, by how many series and categories they had"
- "With a screen reader, the title, subtitle and chapter title fields above a text, and a note's name, are announced by name. They used to give only their grey hint, which disappears once they hold a name"
- "Every panel has its own command and shortcut: Ctrl+Shift+B the binder, T the trash, C the comments, G the writing games, I the inspector, O formatting, D this document's comments, K the footnotes, R the versions, J the search preview and L Go back in time, beside Ctrl+Shift+F for Search. View ▸ Panels lists them all, and the command palette and Settings ▸ Keyboard shortcuts too"
- "The View menu keeps the panels in their own submenu, then the left, right and bottom panels, then the window's modes. Panels and window settings used to be mixed in one list, and half the panels were missing from it"
- "Search preview no longer claims F10, which belongs to the menu bar on Windows and Linux and never reached it there. Revealing an item in the binder brings the binder in front of Search or the Trash, which used to keep it hidden"
- "Help ▸ Using a screen reader opens a new page for writers who use NVDA, JAWS, Orca or VoiceOver, with the cursor in its text: how the window is laid out, the shortcut of every panel, and the keys of the binder, the views bar, the menus and Settings"
- "When Skribisto starts with a screen reader running, it offers to open that page. Tick “Do not show this again” to stop the offer; the page stays in the Help menu, and Settings ▸ Reset to defaults brings the offer back"
- "Undo works again after a visit to Settings. Once Settings had been opened and closed, Ctrl+Z and Edit ▸ Undo no longer took back a move in the binder, a trash or any other change to the project's structure, for the rest of the session"
- "Cut, Copy, Paste and Select all work in the fields of Settings and of the other dialogs, such as Rename. Ctrl+V and Ctrl+A did nothing there"
- "A panel's shortcut, such as Ctrl+Shift+B for the binder, puts you in the panel, and a screen reader says its name. It used to bring the panel forward and leave the cursor where it was"
- "F6 and Shift+F6 move between the left panels, the text in the centre and the right panels, and a screen reader says where you are. Tab goes through the window in reading order: the title bar, the left, the centre, the right and the status bar"
- "With a screen reader, the binder says each item's level and its place among its neighbours, and Shift+F10 or the Menu key opens an item's own menu, with Move at the end. Every item used to read as level 1, and the keyboard opened a Move menu in English instead"
- "With a screen reader, a menu command, a command palette row and a button say their keyboard shortcut. A menu opened from the keyboard starts on its first row, where it used to start on the row chosen last time"
- "The Up and Down arrows change the view of a chapter, part or book, as Left and Right do"
- "In Settings, the lines of the Tags, Statuses, Templates, Personal dictionary and Text replacements pages can be reached from the keyboard: F2 or Enter goes into a line, Tab moves between its fields and Escape comes back to the list"
- "Tab leaves a synopsis, an epigraph, a comment and a footnote for the next control, as in any field. It typed a tab into them"
- "In the help, Tab goes from link to link in a page and Enter follows one"
- "A date field's calendar opens as a small dialog with Cancel and OK. Tab stays inside it, and a screen reader says the date chosen. Tab used to close the calendar without choosing"
- "In New Work, Next takes you into the next page's first field and a screen reader announces the step. The cursor used to stay on Next"
- "In a narrow window, the second half of a split editor no longer draws over the right panels: both halves shrink to fit"
- "Enter at the end of a heading starts an ordinary paragraph, as in LibreOffice Writer, and Enter in the middle of one splits it"
- "On Windows, input methods for Chinese, Japanese and Korean, the emoji panel and voice typing write into Skribisto as they do into Notepad: the candidate window follows the text, and voice typing shows its words as you speak"
- "Chinese, Japanese and Korean text, and emoji, are drawn with the fonts your system uses for them, in colour for emoji, and bold or italic when the text around them is"
- "After Add word, Add rule, Add tag or Add status in Settings, the cursor is back in the field, ready for the next one. It stayed on the button, which greys itself out once the field is empty"
- "The Templates page of Settings fits a narrow window. Its row of buttons made it scroll sideways, cutting off the start of its lines"
- "Ctrl+Shift+O puts you on the first button of the Format panel, like the other panels' shortcuts, and Tab moves through its buttons. They were out of reach of the keyboard, so the shortcut left you in the text. A click on one of them still leaves the cursor and the selection in the text"
- "With a screen reader, the text of a scene, chapter or note is announced as “Text”, its synopsis as “Synopsis” (on a corkboard card too) and a chapter's epigraph as “Epigraph”, and the target box in the Inspector as “Target”. They used to be announced as edit fields with no name, so you could tell them apart only by reading the words in them"
- "Undoing a change to the binder no longer erases what you wrote since. Undoing a move, a duplicate, a trash, a restore, Replace all or an import of tags or templates put the texts it covered back as they were before the change, so the words typed afterwards were lost and the open text was reloaded with a “Typing history reset” message. Only a text the change itself rewrote, as a merge, a split or Replace all does, goes back"
- "When a chapter's Epigraph section is closed, Tab goes past it. It used to stop on its hidden Source line button and on its field"
- "With a screen reader, the binder's items are no longer each described as a tooltip, the Rename field has a name, and a field whose grey hint repeats its name says that name only once"
- "On Windows, a paragraph of the help is one paragraph for a screen reader, as in your own text, and with NVDA's Read by paragraph a braille display shows it whole. A hidden character at the end of each source line used to split it, and the display showed each of those lines as a paragraph of its own"
- "Pictures show in the text again when a project is opened, a Scrivener project or a document is imported, or a text is reopened. Since version 3.0.5 they appeared as blank spaces of the right size, though they were safe in the project and present in exports. This includes macOS, and a high-resolution screen when the last project reopens at launch, where a picture could stay blank after the first fix"
- "A picture added after a project was saved to a new place, with Save As or by the first save of a new folder project, shows when pasted into a text that was already open. It stayed a blank space until the project was closed"
- "Bold, italic, headings and other formatting are saved with your project even if you type nothing afterwards. They used to stay in the open text and be gone the next time you opened the project. After an undo, Redo is offered straight away, and the Edit menu says “Undo the last change to this text”. It used to stay unavailable, and to call every change typing"
- "When you import a project from Scrivener, Manuskript or Plume Creator, Skribisto suggests the folder you last chose for a new project, or your documents folder, instead of the folder your old project sits in. You can still choose any other folder, and Skribisto remembers it next time"
- "Tabbing through a chapter no longer lands on an invisible button: the Tags control shows itself when you reach it, and Space opens it. Tags also show after opening a project from the Launcher, where their dots could be missing. In a column narrowed by the side panels, the corkboard and overview filters keep a field you can see and type in, and the cards stay inside the column. These filters used to shrink to almost nothing, and the cards were cut off at the edge"
- "With a screen reader, Go ▸ Go to… (Ctrl+G) says how many items match as you type and the first of them, and the Up and Down arrows read each match with its place in the list. Enter opens the item with the cursor in its text. It used to say nothing about the results, and Enter left you on the window"
- "Go to… also finds an untitled chapter by the name the binder gives it. It used to show the row, then skip it with the arrows and refuse to open it with Enter"
- "F9 no longer leaves you on the window when the left panel hides with the cursor in it: the cursor goes to the text in the centre, or into the view in front of you when it has no text. A screen reader says when a left, right or bottom panel is hidden or shown, which it used not to. Leaving distraction-free mode with F11 puts the cursor back in your text"
- "On the corkboard, Shift+F2 takes you into a card's synopsis from the keyboard, Tab goes round the card and Escape brings you back to it. A synopsis used to need the mouse, and once inside, Tab jumped to the title bar"
- "On macOS, a project on a mounted remote drive, such as a WebDAV share, can now be saved and backed up. Every save used to fail with “fsyncing temp file” and left a hidden temporary file beside the project. A save is also no longer called failed when it reached the disk but macOS refuses access to its folder, which left the project marked unsaved"
- "The panel names read out by a screen reader or listed under Keyboard shortcuts, the names of the title fields and a few other labels are now in your language in every translation. They used to appear in English in 22 of them"
- "Entering distraction-free mode puts the cursor in your text where you left it, whichever way you enter, so you can go on writing at once. A page with no text takes the cursor in its view, and with nothing open the mode's bar takes it and a screen reader says there is nothing to type in. The cursor used to be lost: keys went nowhere, and a screen reader was left on nothing until you pressed Tab or left the mode. Also, a text in which the synopsis sits beside the prose keeps the cursor when the window gets too narrow or wide enough for that arrangement to change"
- "After Work ▸ Save as folder… or Save as single file…, your recent works list the project where you saved it, at the top, and no longer offer the file you saved from. They used to keep only that older file, so reopening the project from the Launcher or the title bar opened a copy without anything written since. The older file stays where it was, and Work ▸ Open Work… still reaches it. The same goes for a backup you restore: the project it was put back into comes first"
- "When your project cannot be saved as you quit, close it or open another one (a network drive that dropped, a full or write-protected disk, a USB key taken out), Skribisto now asks what to do: leave without saving, losing the changes since the last successful save, or Cancel to keep everything open and try again or use Save As. With autosave on, it used to stay open with only a message, so you could not quit without forcing it"
- "A backup opened beside its project, or the file a Save As left behind opened beside the moved project, keeps its own count in Analysis ▸ Arrivals. The two windows used to add up into one count, kept even after both were closed"
- "The Settings window grows with a larger interface text size, set in Settings or by your system. The list of pages on the left widens with it, and the bars at the top and bottom keep their margins. At 200 % it used to keep its usual size, so the names of the pages, the search field's hint and the commands under Keyboard shortcuts were cut short. Done now sits at the right end of the bottom bar, away from Reset to defaults"
- "Dragging a chapter in the binder or a tab, and selecting text with the mouse, keep up with a fast mouse. With a 1000 Hz mouse on Linux they used to fall behind the pointer and finish only after the button was released"
- "Copy and paste between Skribisto and other applications work on Linux under GNOME with Wayland, in the Flatpak too. They used to work only inside Skribisto there, with no message to say so"
- "Undoing or redoing bold, italic, a heading or a list shows in the text at once, and counts as a change to save. The text used to keep its old look until you typed, and closing the project could lose the undo"
- "In the text, on Windows and Linux, Ctrl+Right goes to the start of the next word, as in other editors, and Ctrl+Up and Ctrl+Down go to the start of a paragraph, with Shift to select. Ctrl+Right used to stop at the end of the word, and Ctrl+Up and Ctrl+Down moved one line"
- "Left and Right with text selected go to the start or the end of the selection. They used to move one letter from the cursor, which could leave it inside the selection. On a line that wraps, Left no longer jumps from the second letter to the end of the line above, and after Undo, Redo, Backspace or Delete there the cursor stays on the line its text is on"
- "The cursor stops blinking after ten seconds with nothing moving it, and stays shown. Typing, a click or coming back to the window starts the blink again"
- "In a table, Down from the line above goes into its first row, Down from its last row goes to the text after it, and Up into a cell that wraps lands on its last line. Shift with an arrow inside a cell of several paragraphs selects text in that cell. The cursor used to stay where it was, or select whole cells"
- "With a screen reader, a line break made with Shift+Enter is read as a line break, and an empty line between two of them as blank. On Windows, NVDA reads the line the cursor is on at the start of a wrapped line, where it used to read the line above. A braille routing key on the cell under the cursor no longer moves it a line up, and a braille display shows a list line at once after Backspace, Undo or Redo"
- "In a message with Show details, such as the one asking what to do when a project cannot be saved, Enter on Show details shows them. It used to answer the question with the default button. Once shown, the details can be reached with Tab, read, selected and copied, and a message whose text wraps keeps its buttons inside it, where a click could miss them and count as Cancel"
---
Version: 3.3.0
Date: 2026-10-27
Type: stable
Description:
- "Shift+Enter, or Format ▸ Insert line break, starts a new line in the same paragraph, for the lines of a poem, a song or a letter. Every export keeps the lines. In an older version of Skribisto, the project still opens, each line then a paragraph of its own"
- "In the find bar, Shift+Enter goes to the previous match, as its button says. It used to go to the next one"
- "In the find bar's replace row, Alt+A replaces every match, on Windows and Linux. It used to do nothing"
- "A scene opened from the Trash can be read, selected and copied, and nothing else: typing, Cut, Paste, the Format menu and panel, the right-click menu, and inserting an image, a footnote or a template all leave it as it is. It used to take them"
- "With “Always forward” on, nothing takes your words away any more. Ctrl+X, a spelling correction, renaming a link and deleting a table row, column or table used to, and a formatting mark, a picture or a scene break inserted over a selection used to replace it"
- "In a scene from the Trash, or with “Always forward” on, the find bar's Replace and Replace All are greyed. They used to look available and do nothing"
- "The search preview shows a scene from the Trash read-only, as its own tab does. A synopsis shown there follows “Always forward” only when the game covers synopses, as it does in the scene"
- "With a screen reader, the text you write is read paragraph by paragraph, a list is announced as a list with its markers and its depth, and a picture or a footnote is read where it stands. Paragraphs used to run together, and lists were read as plain text"
- "Text pasted from a web page or from LibreOffice keeps its line breaks. The words either side of a line break used to run together"
- "Importing a Word, OpenDocument or RTF document, or a Scrivener, Plume Creator or older Skribisto project, keeps the line breaks inside its paragraphs. Each line used to become a paragraph of its own"
- "A long paragraph in Arabic or Hebrew now shows its lines in reading order. Its first line used to show its last words"
- "On a Mac with a Touch Bar, Skribisto no longer crashes when you close one of its windows, such as Settings or Help"
- "On a Mac, quitting from the Dock now asks about unsaved changes, as Work ▸ Quit does, and Cancel keeps everything open. Skribisto used to close at once"
- "When the system closes Skribisto (you log out, restart or shut down, or another program stops it), your open projects are now saved first, without a question. Skribisto used to close with the last changes unsaved"
- "When a menu you opened with the mouse closes, the caret is back in your text and you can go on typing. It used to stay on the menu button, and you had to click back into the text"
- "In the title bar's menu, Edit ▸ Paste, Paste without formatting and Select all now work while you write. They were greyed out whenever the menu was open"
- "The Mac application menu now has Services, Hide others and Show all, in the language of the interface"
- "On a Mac, the help pages name keyboard shortcuts with the Mac's own keys, such as ⌘S. They used to say Ctrl+S"
- "Ctrl+W, or ⌘W on a Mac, now closes Settings and the Help window. It used to do nothing in either"
- "A note's Details page now shows Appears in the manuscript when you first open it after giving the note a Find in prose tag in the Inspector. It used to wait until you closed the note's tab and opened it again"
- "On a Mac and on Windows, choosing Discard when New Work asks about unsaved changes now opens the New Work form. The question closed and nothing else happened"
---
Version: 3.2.3
Date: 2026-10-21
Type: stable
Description:
- "A button in the title bar, beside Export, opens distraction-free mode. F11 and View ▸ Distraction-free Mode still work"
- "Software centres such as Discover and GNOME Software now find Skribisto when you search for words like novel, book, writer or manuscript, in English and in each of the 24 interface languages. With the French interface, searching for novel used to find nothing"
- "With the System theme, Skribisto now turns light or dark with your desktop while it is open. After a restart, it used to keep the shade it opened in until you chose System again in Settings"
- "On Linux, the System theme now reads your desktop's light or dark setting without the busctl tool, and a desktop that does not answer delays startup by a second at most"
---
Version: 3.2.2
Date: 2026-10-16
Type: stable
Description:
- "F11 now opens and closes distraction-free mode, and Shift+F11 makes the window fullscreen. They used to be the other way round"
- "In distraction-free mode, comments now take the colours of the page you write on. With a dark theme in a light window, or the other way round, the text under a comment could not be read"
- "The bar at the bottom of distraction-free mode has a Comments button, to show or hide comments without leaving the mode"
---
Version: 3.2.1
Date: 2026-10-15
Type: stable
Description:
- "Typing in the command palette keeps every character you type. Only the last character used to stay, because each key replaced the whole search"
- "On a new installation, the margin marks now show the dialogue texture from the start: one bar per paragraph, showing how long it is and how much of it is spoken. If you already use Skribisto, nothing changes for you: turn it on or off in Settings ▸ Editor ▸ Margin marks"
- "A paragraph you start by typing a hyphen, an asterisk or 1. followed by a space becomes a bulleted or numbered list. Press Backspace right after to keep what you typed as text, or turn it off in Settings ▸ Editor ▸ Punctuation defaults. Where the dialogue dash is on, a hyphen still opens a line of dialogue"
- "The bulleted and numbered list buttons, in the Format panel and the Format menu, now show when the cursor is in a list, and pressing one again takes the paragraph out of the list. In a list of the other kind, the button turns the whole list into bullets or numbers"
---
Version: 3.2.0
Date: 2026-10-14
Type: stable
Description:
- "Each book now has its own cover. Open the book and choose its cover on the book's own page, where you can also see it, change it or remove it. When you export one book, its cover opens the file, and when you export several books together, each one starts with its own cover. An EPUB carries the cover only when the export style asks for it and the export holds one whole book. Covers chosen in an earlier version are not carried over, so choose them again; the pictures are still in your project"
- "In a Word or OpenDocument export, the cover and every other picture fit within the page margins. A large picture used to be printed at its own size and run off the page"
- "The cover and the title page of a Word or OpenDocument export carry no page header and no page number, and the page numbers start at 1 on the first page of the text"
- "An export titles the book with the book's own title: on the title page, in the page header and in the file's details. It used to use the name of the project file. A project holding several books still uses the project's title when you export them together"
- "When the export style has no title page, the book's title is centred at the start of the book. It used to sit on the left like an ordinary heading"
- "The cover, the author line, the word count and the scene break marks of an export are no longer indented like the first line of a paragraph"
- "An OpenDocument export keeps the scene break mark your export style chooses, such as # in the standard manuscript style. It used to replace it with a horizontal line. Imported back into Skribisto, a stronger scene break also stays a stronger one"
- "In a Word export, a paragraph keeps its own line spacing when it also has space above or below it"
- "Importing a Word or OpenDocument file starts a new page where the file starts a new page with a new section, and no longer where a section continues on the same page"
---
Version: 3.1.0
Date: 2026-09-28
Type: stable
Description:
- "Import your Scrivener projects with Work ▸ Import from ▸ Scrivener (.scriv)…, whether they come from Scrivener 3, Scrivener 2 on the Mac, Scrivener for Windows or the Linux beta. You see how your binder will look before anything is created, your keywords, targets and deadline come along, and a report tells you what to check once it is done. Your Scrivener project itself is never changed. The new help topic Coming from Scrivener explains the rest"
- "Added app interfaces in Arabic (Saudi Arabia), Czech, Danish, Greek, Hebrew, Hungarian, Norwegian Bokmål, Dutch, Romanian, Swedish and Turkish, including menus, dialogs, settings and tooltips. Longer help articles use English"
- "Added interfaces in German (Germany), Italian, Spanish, Portuguese (Portugal), Polish, Finnish, Russian, Ukrainian, Korean (South Korea), Japanese and Esperanto, including menus, dialogs, settings and tooltips"
- "Added help articles in German, Italian, Spanish, Portuguese (Portugal) and Polish. Finnish, Russian, Ukrainian, Korean, Japanese and Esperanto use English for the longer help articles"
- "English and French help now gives clearer steps for starting a project, saving, importing and exporting, with less jargon and fewer technical details"
- "Updated the Teksilo interface libraries to 0.16.0"
- "A Plume Creator or Manuskript project imported without a name, and the notes and texts the import makes up, are named in the language Skribisto is set to. They used to be named in English"
- "A Plume Creator or Manuskript import is shown in the language Skribisto is set to: its progress, its notes about what it could not carry across, and the reason a project cannot be imported. They used to be in English whatever the language"
- "Quitting while a project import is running asks first, and stopping the import leaves no half-written file behind"
- "Projects are imported one at a time, whichever importer and window starts them: a second import started while one runs says so, and can be started again once the first has finished"
- "When there is not enough space left to write an imported project, the message names the folder that is full"
- "Cancelling a project import says the import is stopping until it really has, and keeps its destination reserved until then. It used to say the import was cancelled at once, while the import could still be writing its file, and let that file be opened or imported into meanwhile"
- "A project kept as a folder under the name chosen for an import is pointed out as soon as the name is typed. The import used to offer to replace it, convert the whole project, then fail"
- "Importing a Word, OpenDocument or Markdown file brings its pictures into the project, each where it sat in the text and with its description, and a save keeps them in the project. The review step says how many pictures come, and names each one that stays behind with the reason, such as a drawing in a format Skribisto cannot show or a picture on the web. A picture the project already holds is not stored twice, and undoing the import takes its pictures back with the text"
- "Copying, cutting or dragging text that runs out of a table takes the whole table and nothing else, so a cut pasted back gives the text back as it was. Text after the table used to be lost from the copy, or the table came back twice"
- "Dragging a passage over a table drops it where you release it, dragging selected table cells no longer leaves an empty grid behind, and selected table cells are shown as selected"
- "A numbered list keeps the number it starts at when the project is saved and opened again, and when it is copied"
- "Two quotations one after the other stay two quotations when the project is opened again"
- "Pasting several paragraphs into an empty scene keeps the format you gave its first line, such as a quotation for an epigraph"
- "Tab, Shift+Tab and Enter work in a table inside a quotation"
- "Typing with an input method over a selection replaces the selection once, without leaving the first candidate in the text"
- "Importing or exporting no longer leaves idle background tasks running until Skribisto is closed"
- "The command palette and the keyboard shortcut settings show the group of each command, such as File or Edit, in the language Skribisto is set to, and the palette finds a command when you type its group's name in that language. The General group of the shortcut settings is translated too"
- "A window that is minimized or hidden behind other windows stops drawing until it is shown again, which spares the battery. On macOS every window rests the same way while the display sleeps or the screen is locked"
- "On macOS, a window opened while the display sleeps or the screen is locked no longer keeps a processor core busy until it appears"
- "On Linux under Wayland, Skribisto no longer wakes the processor twice for everything it does, which it did on desktops that support drawing tablets, whether or not a tablet was attached"
- "With a screen reader running, each change is drawn once rather than twice, and the screen reader is sent only what has changed"
- "A text holding pictures takes less work to scroll and redraw, as its pictures are no longer copied each time the window is drawn"
- "When closing a window has a question to ask first, such as what to do with unsaved changes, the question appears at once. It used to wait for the next key press or mouse movement"
- "On Windows and on Linux under X11, the Enter that answers a system dialog, such as the file chooser, no longer acts a second time in the window behind it"
- "The notifications list shows how an import ended: its entry names what the last notice offered, a failed import is listed as an error, and an import run again comes back to the top of the list with its own date. The entry used to keep the Cancel of the import's progress notice, and a later import was listed under the date of the first"
- "In the notifications, a finished import's entry keeps Open now, which opens the imported project in a window of its own. It used to show Open now as a label that did nothing"
- "A checkbox beside other controls, such as Preserve case in the replace bar, shows its label, shortened only when the row runs out of room. It used to show an ellipsis in place of the label"
- "Alt with the underlined letter of a menu opens that menu when the menu bar is folded into its menu button, and no longer closes a menu it should open. While a dialog is open, it no longer reaches the menu bar behind the dialog"
- "After an item is chosen from a submenu, one click on the menu's name opens it again. It used to take two"
- "Part of a window that changed while it was scrolled out of view shows its new content when it comes back into view, rather than what it showed before"
- "A section opened while its window is in the background, for instance by a screen reader, unfolds at once. It used to stay folded under a header that said it was open"
- "A list or a box partly scrolled out of the top of the window no longer lets its contents show past its own lower edge"
- "A cancelled import or export no longer leaves the loading spinner turning in its notice after the work has stopped"
- "A backup's notice no longer keeps spinning once the backup has ended. When a backup taken on closing fails before reaching any destination, the dialog names the error, and a backup whose outcome cannot be read says so"
---
Version: 3.0.5
Date: 2026-09-28
Type: stable
Description:
- "Dates and times in the Versions dock, the Timeline, the backups list, the Trash, the project switcher, the Welcome window and the restore confirmations are shown in your own time zone. They were shown in UTC while presenting themselves as local time, which could put a version on the wrong day"
- "Pace and daily progress credit words to the day you wrote them, on your own calendar. A writer west of UTC used to see evening words counted for the next day"
- "The Versions dock lists the earlier versions of front and back matter, such as a preface, as it does for any other text"
- "The warnings of a Plume Creator or Manuskript import stay on screen until you close them or the next import of the same kind brings its own, and can be opened again afterwards from the notifications. They used to disappear after ten seconds"
- "Choosing where to save a new or imported project no longer writes and deletes a test file in that folder over and over while the dialog is open"
- "An import can no longer overwrite a project that is open in a window, in this copy of Skribisto or another one"
- "While a Plume Creator or Manuskript import is writing a project, that project cannot be opened, created again with New Work, saved over with Save As, restored from a backup or chosen for a second import, from this copy of Skribisto or another one. On Windows and macOS this holds however its name is capitalised, on macOS however its accented letters are encoded, and on Windows whichever slash separates its folders"
- "A Plume Creator or Manuskript project, or a Word or OpenDocument file, whose contents are nested far more deeply than any real file is refused with a message instead of closing Skribisto and every open window"
- "The characters you type come back as you typed them after the project is saved and opened again. A time such as 10:30:45 or a name such as std::vector no longer loses its colons and the characters between them, a paragraph that begins with I. or A. stays a paragraph instead of turning into a list item without its letter, a paragraph opened with a tab or spaces keeps them, and straight quotes, -- and ... stay as typed instead of becoming English curly quotes, dashes and an ellipsis. Turning them into typographic marks is left to smart punctuation, which follows your project’s language"
- "Characters named in the text of a Manuskript project import as their plain name, without a stray backslash, and an image description or a chapter title keeps its colons and asterisks as typed"
- "Comments imported from a Word or OpenDocument file stay on the words they marked after a paragraph holding two spaces in a row or a tab. The comments of every later paragraph used to lose their place and fall back to the whole document"
- "An imported Word or OpenDocument file keeps its centred and right-aligned paragraphs, its page breaks, its superscript and subscript, its double spaces, and its straight quotes, dashes and ellipses as they were written"
- "Importing a plain-text file keeps every character as written: asterisks, underscores and other marks are no longer read as formatting"
- "An imported document, or a Plume Creator or Manuskript project, whose formatting is nested past what a project can hold arrives as its words with a note, instead of producing a project that will not open again"
- "A damaged or truncated Word file is reported as unreadable instead of freezing the import for good"
- "A project or Markdown file crafted to nest its contents thousands of levels deep can no longer close Skribisto: the project is refused with a message, or the file’s words are kept as plain text"
- "A paragraph typed after a long run of spaces no longer makes the project refuse to open the next time"
- "An OpenDocument file asking for an enormous run of spaces imports with that run shortened, and the import review says so"
- "A compressed document or project built to unpack far larger than it is, a zip bomb, is refused instead of filling the computer’s memory"
- "A Plume Creator or Manuskript project built to multiply a few kilobytes into gigabytes of text as it is read is refused with a message, instead of filling the computer’s memory and closing Skribisto"
- "A Word or OpenDocument file crafted to keep the import busy for hours or days is reported as unreadable in a moment. Such an import used to ignore Cancel until it ended"
- "A list indented dozens of levels deep no longer makes the project refuse to open"
- "Typewriter scrolling keeps the line you are typing at its place on the page again. Since 3.0.4 it only followed the caret, as ordinary scrolling does"
- "A long scene opens, and an earlier version of it is put back, in a moment. A scene of several thousand paragraphs used to take seconds, and one of 16,000 close to a minute, during which the window did not respond"
- "Putting back an earlier version of a text holding footnotes, pressing Backspace in a quotation, or deleting across the edge of a table no longer closes Skribisto. Typing or pressing Enter just before a footnote reference keeps the footnote where it was, and a table pasted in the middle of a text keeps the text after it in place"
- "Copying, cutting or dragging text in a quotation takes each paragraph once. A nested quotation used to be copied two or three times over, and a cut then paste wrote it back doubled"
- "Putting back an earlier version keeps its quotations and code blocks, which it used to turn into plain paragraphs"
- "A passage pasted from a web page as preformatted text arrives as one paragraph per line, and every line stays as it was at the next opening. Its later lines used to come back as lists, headings or quotations, sometimes nested so deep that the project would not open"
- "Export keeps every line of a passage holding line breaks, and every link or picture whose address holds a |, a parenthesis or a space. Quotations nested more than 55 levels deep export to Word, and more than 16 to PDF, instead of failing"
- "Holding Tab in a quotation or a list stops at 64 quotation levels and 16 list levels. It used to go on for as long as the key repeated, and after about 97 presses the project would not open again"
- "Tab and Shift+Tab on a list item in a quotation move it one level, as in the rest of the text. They used to take the item out of its list for good"
- "Tab at the end of a list's last item moves the item one level instead of typing a tab, and no longer pushes a quoted paragraph after the list one quotation deeper"
- "Splitting a scene keeps every word. The new scene lost one of its last characters for every paragraph after the caret, and a caret in a table put the table in both scenes and lost everything after it"
- "Splitting a scene keeps the paragraph at the cut a heading, a list item, a quotation or a code block, leaves no stray space at the start of the new scene, and refuses to make an empty one"
- "A comment goes with its words when a scene is split or two scenes are merged. It used to stay behind and report that it had lost its words"
- "Jumping to a comment or a footnote near the end of a long scene lands on it. It used to stop a few lines short"
- "Importing a Word or OpenDocument table with one row far wider than all the others says that its cells arrive as paragraphs, instead of dropping the grid in silence"
- "The check for a new version of Skribisto uses an updated encryption library, which fixes a flaw in how it accepts a secure connection"
- "A picture inserted into a folder project after its first save, or into any project after Save As, is kept by the next save. It used to be written where the save does not look, and came back blank at the next opening"
