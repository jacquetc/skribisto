Version: 3.0.1
Date: 2026-09-03
Type: stable
Description:
- "Windows now tell the desktop which application they belong to, so Skribisto keeps its own name and icon in the task switcher and its notifications are attributed to it"
- "Packaging fixes for the Flathub build and its store listing"
