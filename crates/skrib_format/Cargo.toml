# Hand-written (NOT generated by Qleany). The `.skrib` document format: RON+Djot
# bundle (de)serialisation and Qt-HTML<->Djot conversion. Extracted from
# `work_management` so it can be shared with the `import_management` feature
# without a feature-to-feature dependency.
[package]
name = "skribisto-skrib-format"
description = "The .skrib document format: RON+Djot bundle (de)serialisation and Qt-HTML<->Djot conversion"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "../../README.md"
publish = false

[lib]
name = "skrib_format"

[dependencies]
anyhow = { workspace = true }
common = { workspace = true }
skribisto_model = { workspace = true }
serde = "1.0"
chrono = { workspace = true }
uuid = { workspace = true }
blake3 = "1"
text-document = { path = "../../../text-document/crates/public_api", version = "1.7" }
ron = "0.12.2"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tempfile = "3"
walkdir = "2"
unicode-normalization = "0.1"

[lints]
workspace = true
