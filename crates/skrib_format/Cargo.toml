# Hand-written (NOT generated by Qleany). The `.skrib` document format: RON+Djot
# bundle (de)serialisation and Qt-HTML<->Djot conversion. Extracted from
# `work_management` so it can be shared with the `import_management` feature
# without a feature-to-feature dependency.
[package]
name = "skribisto-skrib-format"
description = "The .skrib document format: RON+Djot bundle (de)serialisation and Qt-HTML<->Djot conversion"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "../../README.md"
publish = false

[lib]
name = "skrib_format"

[features]
# The crafted archives in `zip_guard::fixtures` (bombs and over-declared
# members) for the tests of every reader `ZipGuard` protects, and the
# peak-memory allocator in `xml_depth::fixtures` the entity-bomb tests measure
# with. Off by default; each reader's crate turns it on in its own
# dev-dependencies, so the fixtures never reach a release build.
hostile-fixtures = []

[dependencies]
anyhow = { workspace = true }
common = { workspace = true }
skribisto_model = { workspace = true }
serde = "1.0"
chrono = { workspace = true }
uuid = { workspace = true }
blake3 = "1"
text-document = { workspace = true }
ron = "0.12.2"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tempfile = "3"
walkdir = "2"
unicode-normalization = "0.1"
# Every importer's XML goes through `xml_depth::parse`, which refuses a document
# nested past the ceiling and then parses it on a stack deep enough for it. The
# same parser and version the importers already use, so this adds no second one.
roxmltree = "0.21.1"

# Used only by the `build_example` tool, which reads each bundled example's
# editorial-metadata spec.
[dev-dependencies]
toml = "1.1.3"
# A project's file names are made out of its titles, so the format's sharpest
# invariants are statements about every title rather than about one fixture — and
# the sharpest of them, "a no-op save changes nothing on disk", is what the two
# shipped naming faults both broke. See `src/property_tests.rs`.
proptest = { workspace = true }

[lints]
workspace = true
