# Hand-written (NOT generated by Qleany). Reads a Scrivener project of any
# generation (formats 1.0, 1.5 and 2.0, iOS projects), from a folder, a zip or a
# .scrivtemplate, into one version-neutral model, with typed refusals, questions
# and notices, and converts it into a newest-version .skrib. Store-free, like
# manuskript_import: it never touches an entity.
[package]
name = "skribisto-scrivener-import"
description = "Reads a Scrivener project of any generation and converts it into a .skrib"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "../../README.md"
publish = false

[lib]
name = "scrivener_import"

[dependencies]
# The bounded XML parse (`xml_depth`) and the guarded archive reader
# (`zip_guard`) every importer shares.
skrib_format = { workspace = true }
# The manifests, the search index, the sidecars. The same parser and version the
# other importers use, always behind `xml_depth`'s ceiling.
roxmltree = "0.21.1"
# Scrivener backups, iOS exports and the zip inside a .scrivtemplate.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# The model crosses a long operation's boundary as JSON.
serde = { workspace = true }
uuid = { workspace = true }
# Reading Scrivener's one date form, offset kept.
chrono = { workspace = true }
# Telling manifests apart and the analysis fingerprint. Nothing is hashed for
# integrity: Scrivener's own checksums are routinely stale.
blake3 = "1"
# Lookups by the NFC form of a name: HFS+ hands over decomposed names.
unicode-normalization = "0.1"
# A Scrivener 3 .scrivtemplate's project zip.
base64 = "0.22"
# This computer's name, to tell a lock left here from one left elsewhere.
gethostname = "1.1"
# Whether a document holds any writing, and where its chapter headings are:
# the structure mapping decides rows on what a text holds, not on its size.
rtf_reader = { workspace = true }
# The writing model's matrix: every planned row is validated against it, so the
# plan can never propose a combination the app would refuse or silently drop.
skribisto_model = { workspace = true }
# The role, sub-role and content-role enums the matrix is written in; the uids a new
# project's rows are minted with.
common = { workspace = true }
# The prose: Scrivener's RTF mapped onto the rich model the Word and OpenDocument
# importers share, written as Djot by the same emitter and proved by the same parser, its
# comments anchored by the same rule, its pictures brought in by the same checks.
document_ingest = { workspace = true, features = ["rtf"] }

[target.'cfg(unix)'.dependencies]
# Opening a member without following a link or blocking on a FIFO.
libc = "0.2"

[dev-dependencies]
# Projects of every generation and container, and the traps, built at test time.
scrivener_fixtures = { workspace = true }
tempfile = "3"
# The JSON round trip the model must survive (G5).
serde_json = "1.0"
# Crafted zip bombs and over-declared members.
skrib_format = { workspace = true, features = ["hostile-fixtures"] }
proptest = { workspace = true }
# The editor's own save, for the round trip every converted text must survive.
text-document = { workspace = true }
# The written project loaded into a real store through `load_work`, and saved back out.
work_management = { workspace = true }

[lints]
workspace = true
