# SPDX-FileCopyrightText: 2026 Cyril Jacquet

# Hand-written (NOT generated by Qleany). The format-agnostic half of document
# import: a neutral block model, the `SourceScanner` seam every format plugs
# into, and the shared pipeline that turns scanned documents into an import
# plan. Its own crate — rather than a module inside import_management — so a
# future feature (Split Document, paste-with-structure) can reach it without a
# feature-to-feature dependency, exactly as skrib_format and binder_ordering
# were extracted before it.
[package]
name = "skribisto-document-ingest"
description = "Format-agnostic document ingest: block model, scanner seam, and import planning"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "../../README.md"
publish = false

[lib]
name = "document_ingest"

# One feature per input format, as `sources.rs` prescribed before there was
# anything heavy to gate: a consumer that only imports Markdown does not build an
# OOXML parser. The registry, the file-picker filter and the drop zone's accept
# list all read `ScannerRegistry::accepted_extensions`, so the gating reaches the
# UI with no second list to keep in step.
#
# Check the gating with `cargo tree -p skribisto-document-ingest
# --no-default-features --features markdown --depth 1`, never with a `grep` over
# the whole tree: `docx-rs` also arrives far below through text-document's own
# DOCX *export*, which has nothing to do with these features and would make a
# working gate look broken.
[features]
default = ["markdown", "odt", "docx"]
# `.md` and `.txt` — plain text runs through the Markdown scanner by design, so
# the two travel together.
markdown = ["dep:pulldown-cmark"]
odt = ["dep:zip", "dep:roxmltree"]
# `zip`/`roxmltree` alongside `docx-rs` for the supplementary pass over
# `word/document.xml`: two constructs a manuscript really uses — a comment anchored
# to a point rather than a range, and a horizontal rule — live in elements the typed
# reader does not surface. See `sources::docx::RawScan`.
docx = ["dep:zip", "dep:roxmltree", "dep:docx-rs"]

[dependencies]
# Every imported document's own digest, taken in `scan_bytes` where its bytes are
# already in hand. The *same* hash `skrib_format` uses for the history log and the
# content fingerprint — a second hash function in one project's provenance would be
# a second thing for anything reading it to implement.
blake3 = "1"
common = { workspace = true }
skribisto_model = { workspace = true }
skrib_format = { workspace = true }
anyhow = { workspace = true }
# `SourceAnnotation::uid`/`SourceAnnotationReply::uid` (M-S7): the identity a
# comment carried in the source file when that file is one Skribisto itself
# exported — the DOCX/ODT writers' own `skrb:uid` attribute, read back here so
# `apply_document_import_uc` can recognise a round-tripped comment instead of
# duplicating it. Same crate + feature set `common`'s own entities already use.
uuid = { workspace = true }
# Timestamps on imported comments — the same type `EntityBase` stores them in, so
# a `.docx` comment keeps the date its author wrote it rather than the date it was
# imported.
chrono = { workspace = true }
# Byte-order-mark sniffing and never-panicking lossy decode. Already the
# workspace's answer to "these bytes claim an encoding" (teksilo_ui's spellcheck
# reads a Hunspell .aff's declared SET line with it).
encoding_rs = "0.8"
# The CommonMark parser. Its `into_offset_iter` is why the scanner owns its own
# parse rather than leaning on text-document, which exposes no source offsets.
pulldown-cmark = { version = "0.13", optional = true }
# `.docx` and `.odt` are both zip containers of XML. Same versions
# `import_management` reads `.plume` with — one zip reader and one XML parser in
# the tree, not three.
zip = { version = "8.6.0", default-features = false, features = ["deflate"], optional = true }
roxmltree = { version = "0.21.1", optional = true }
# The OOXML reader. `read_docx` gives a typed document tree with paragraph
# properties, tracked changes as first-class children, and the comment/
# comments-extended parts — all of which would otherwise be hand-parsed XML.
#
# Pinned exactly, matching `text-document`'s `document_io` crate (the DOCX
# *writer*, for comment export): that crate pins docx-rs because its comment
# writer patches raw XML bytes out of `Docx::build()`'s output for fields
# docx-rs's public builder cannot set — an undocumented internal shape a loose
# `"0.4"` could drift out from under. Cargo resolves one version across a
# semver-compatible range, so reader and writer must name the *same* one or the
# workspace stops resolving at all.
#
# The shared version is **0.4.22**, not the writer's original `=0.4.21`: this
# reader was already on 0.4.22, and unifying downward would have silently
# downgraded it to satisfy a pin added later. The writer is safe here —
# `elements/comment.rs`, `elements/comment_extended.rs` and `elements/paragraph.rs`
# are byte-identical between the two releases, `xml_docx.rs` differs only in doc
# comments, and the `CommentExtended::new(para_id)` auto-collector is unchanged.
# Verified by diffing the extracted crate sources rather than assumed.
docx-rs = { version = "=0.4.22", optional = true }
# Spelled-out ordinals in headings — "Chapter Three", "Chapitre premier". A
# per-language number-word table is the whole job, and this one already carries
# seven of them (en/fr/de/es/it/pt/nl), compound forms included
# (`quatre-vingt-dix-neuf`, `einundzwanzig`) and ordinals as well as cardinals.
# Hand-writing that table for even the six Latin-script languages `title.rs`
# already names keywords for would be several hundred lines of vocabulary this
# project has no way to review in every one of them.
#
# ⚠ **Pinned to the 2.7 line, and the tilde is load-bearing.** `2.8.0` renamed
# `Language::portuguese()` to `Language::portugese()` — a typo introduced under a
# *minor* bump, so a caret requirement resolves straight into a build failure in
# `title.rs`. Nothing here notices, because `Cargo.lock` holds this workspace at
# `2.7.0`: the break only appears where a lock file does not, which is a fresh
# clone, a fresh worktree and CI. It cost a working day of a downstream build
# once, diagnosed as a broken checkout.
#
# `~2.7` accepts `2.7.x` and refuses `2.8`. To move past it, change the call in
# `title.rs::WordLang::interpreter` to whichever spelling that release ships and
# check every other `Language::*` constructor named there in the same pass —
# upstream has now demonstrated it will rename one without saying so.
text2num = "~2.7"

[dev-dependencies]
# M-T2a round trip: `text-document` now has an ODT *writer* (`TextDocument::to_odt_with_options`)
# to go with this crate's ODT *reader* (`sources::odt::OdtScanner`) — dev-only, so it proves the
# two agree on the wire format without this crate depending on text-document's export machinery
# at runtime (`odt.rs`'s own doc comment: this scanner deliberately reads raw XML rather than
# leaning on text-document, which exposes no source offsets — that reasoning is about the
# *reader*, and does not apply to a *test* proving the writer and reader are consistent).
text-document = { workspace = true }

[lints]
workspace = true
