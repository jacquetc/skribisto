# Hand-written (NOT generated by Qleany). The format-agnostic half of document
# import: a neutral block model, the `SourceScanner` seam every format plugs
# into, and the shared pipeline that turns scanned documents into an import
# plan. Its own crate — rather than a module inside import_management — so a
# future feature (Split Document, paste-with-structure) can reach it without a
# feature-to-feature dependency, exactly as skrib_format and binder_ordering
# were extracted before it.
[package]
name = "skribisto-document-ingest"
description = "Format-agnostic document ingest: block model, scanner seam, and import planning"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "../../README.md"
publish = false

[lib]
name = "document_ingest"

[dependencies]
common = { workspace = true }
skribisto_model = { workspace = true }
skrib_format = { workspace = true }
anyhow = { workspace = true }
# Byte-order-mark sniffing and never-panicking lossy decode. Already the
# workspace's answer to "these bytes claim an encoding" (bastyde_ui's spellcheck
# reads a Hunspell .aff's declared SET line with it).
encoding_rs = "0.8"
# The CommonMark parser. Its `into_offset_iter` is why the scanner owns its own
# parse rather than leaning on text-document, which exposes no source offsets.
pulldown-cmark = "0.13"
# Spelled-out ordinals in headings — "Chapter Three", "Chapitre premier". A
# per-language number-word table is the whole job, and this one already carries
# seven of them (en/fr/de/es/it/pt/nl), compound forms included
# (`quatre-vingt-dix-neuf`, `einundzwanzig`) and ordinals as well as cardinals.
# Hand-writing that table for even the six Latin-script languages `title.rs`
# already names keywords for would be several hundred lines of vocabulary this
# project has no way to review in every one of them.
text2num = "2.7"

[lints]
workspace = true
