[package]
name = "skribisto-resource-management"
description = "resource_management feature for Skribisto"
authors.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
version.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme = "../../README.md"
publish = true

[lib]
name = "resource_management"

[dependencies]
anyhow = { workspace = true }
common = { workspace = true }
macros = { workspace = true }
serde = "1.0"
serde_json = "1.0"
chrono = { workspace = true }
uuid = { workspace = true }
# The stored files' content hash, the same blake3 every other part of a project uses.
blake3 = "1"
# Where a stored file goes inside the project's resources directory, and the one rule
# for turning the writer's file name into a safe one.
skrib_format = { workspace = true }
# A stored picture's size, read from its header under the import ceilings.
document_ingest = { workspace = true }
# A stored file lands under a temporary name beside its place and is renamed into it.
tempfile = "3"

[lints]
workspace = true



