<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Pinned tab — a drawing pin seen head-on, filled. The same shape the
       Versions dock's pin control wears, copied rather than shared: `res!`
       embeds a literal path per call site, so one asset per meaning per feature
       directory is what keeps the editor's chrome from depending on another
       feature's assets folder.
       The barrel **flares** toward the bottom, and that is the load-bearing
       detail rather than a flourish. A pin drawn the other way round — wide cap,
       narrowing body, thin stem — is the silhouette of a funnel. Narrow at the
       top, wide at the shoulders, needle below: that shape is only ever a
       thumbtack.
       Filled rather than stroked because of where this one is read. It stands in
       for the tab's sub-role icon, so a writer scanning a strip of twenty
       near-identical chapter tabs has to pick the pinned ones out at a glance,
       against a row of outlined document and folder glyphs. A silhouette
       survives that scan; an outline of the same size joins the crowd.
       Stroked at 1.2 rather than the versions copy's 1.0 — that is the weight
       every other 16 dp glyph in this directory (split, spellcheck, save) is
       drawn at, and the crossbar and needle are bare strokes: at 1.0 beside
       them they read as hairlines. -->
  <path d="M6.6 2.9 V6.3 L4.5 9.4 H11.5 L9.4 6.3 V2.9 Z"/>
  <path d="M5.3 2.9 H10.7" fill="none"/>
  <path d="M8 9.4 V13.7" fill="none"/>
</svg>
