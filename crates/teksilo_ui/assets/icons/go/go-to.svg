<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
  <!-- Go to: jump to a precise place — a target/crosshair. Deliberately not a
       magnifier: this navigates to a known item, it does not search content
       (that is the Find dock's glyph, and the two must not read alike). -->
