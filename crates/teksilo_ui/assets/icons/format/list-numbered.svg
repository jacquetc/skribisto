<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
  <!-- Numbered list — three lines, two numerals. A digit tall enough to read at
       16px needs about 4 units, and three of them stacked on 4-unit rows leave
       no gap between one numeral's foot and the next one's head: the column
       closes into a vertical smear. Numbering the first and last row is what the
       common 16px sets do, and it buys 4.6 units of air. -->
  <path d="M7.2 4.0 H13.6"/>
  <path d="M7.2 8.0 H13.6"/>
  <path d="M7.2 12.0 H13.6"/>
  <path stroke-width="1.05" d="M2.8 3.0 L4.2 2.0 V5.9"/>
  <path stroke-width="1.05" d="M2.7 5.9 H5.7"/>
  <path stroke-width="1.05" d="M2.7 11.0 c0 -1.6 3.0 -1.5 3.0 0.2 c0 1.4 -3.0 1.9 -3.0 3.4 H5.8"/>
</svg>
