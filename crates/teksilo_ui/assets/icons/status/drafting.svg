<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="butt">
  <!-- In progress: the same ring, now solid, with a quadrant filled from 12 o'clock.
       Differentiated from `planned` by INK MASS, not by counting strokes — the rule
       `binder/icons.rs` sets out, because a raster at 16px preserves mass and destroys
       stroke counts. The wedge is a filled path rather than a heavy dashed stroke so it
       survives downscaling. -->
