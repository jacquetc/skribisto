        d="M8 1.5 A6.5 6.5 0 1 1 8 14.5 A6.5 6.5 0 1 1 8 1.5 Z
           M10.94 5.79 L7.15 9.58 L5.06 7.49 L3.94 8.61 L7.15 11.82 L12.06 6.91 Z"/>
</svg>
