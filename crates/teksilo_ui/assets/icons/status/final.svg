<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
  <!-- Done: a solid disc with the check knocked out of it. Maximum ink, the far end of the
       ramp, and unmistakable against `revised` even in one flat colour. The check is cut
       out rather than drawn on top so the glyph needs no second colour token to stay
       legible on any surface. -->
