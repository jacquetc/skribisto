<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
  <!-- Versions — a clock hand swept back, drawn over the page it belongs to.
       The counter-clockwise arrow is the one shape every restore-a-past-state
       feature has converged on, so it needs no learning; the page keeps it from
       reading as a generic "undo", which is a different promise entirely (undo
       is this session, this is every session before it).

       Stroked rather than filled, at 1.3, to sit with its rail neighbours. -->
  <path d="M3.2 6.6 A5 5 0 1 1 3.4 9.9"/>
  <path d="M3.2 3.4 V6.7 H6.4"/>
  <path d="M8 5.4 V8.2 L10.2 9.5"/>
</svg>
