<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
  <!-- Writing games — a pen nib travelling right along a rule, with the arrow
       ahead of it. The forward arrow is the family's whole idea (the one game
       today is "Always forward"), and the baseline says the subject is prose
       rather than motion in general. Deliberately not a die or a game pad: these
       are constraints a writer sets themselves, not entertainment. -->
