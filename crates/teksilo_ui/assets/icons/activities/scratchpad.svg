<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
  <!-- Scratchpad — a spiral-bound pad with a scribble and a short line: notes kept
       beside the page, not the page. The rings at the top are what tell it apart
       from the binder's own document glyphs, which are plain sheets. -->
