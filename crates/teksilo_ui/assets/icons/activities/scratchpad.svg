  <path d="M5.6 2.2 V5"/>
  <path d="M8 2.2 V5"/>
  <path d="M10.4 2.2 V5"/>
  <path d="M5.2 8.1 q0.9 -1 1.8 0 t1.8 0 t1.8 0"/>
  <path d="M5.2 11.2 H8.6"/>
</svg>
