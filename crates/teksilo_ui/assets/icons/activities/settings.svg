<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
  <!-- Settings — a cog, drawn as ONE closed outline whose teeth are part of the rim.
       The previous artwork was a thin ring plus six short radial strokes, which is a
       ship's helm, not a cog: a helm IS a thin ring with handles poking out of it, so
       "teeth" that are detached line segments land on the wrong object no matter how
       short they are. The fix is not shorter spokes but real teeth — wide, stubby, and
       continuous with the ring, so the silhouette has a gear's notched rim.
       Geometry (6 teeth, crest r=5.9, root r=4.1, tooth half-width 16°) is tuned for a
       16dp rail glyph: the 28°-wide notches stay open at 1x, and the crest radius keeps
       the ink mass level with `search.svg`/`outline.svg` rather than overpowering them.
       Widening the teeth much past this closes the notches and it reads as a knurled
       ring instead; see `settings/appearance.svg` for the same size lesson. Matched
       tooth for tooth by `session/gear.svg`. -->
  <path d="M13.67 6.37 L13.67 9.63 L11.94 9.13 L10.95 10.85 L12.24 12.10 L9.43 13.72
           L8.99 11.98 L7.01 11.98 L6.57 13.72 L3.76 12.10 L5.05 10.85 L4.06 9.13
           L2.33 9.63 L2.33 6.37 L4.06 6.87 L5.05 5.15 L3.76 3.90 L6.57 2.28
           L7.01 4.02 L8.99 4.02 L9.43 2.28 L12.24 3.90 L10.95 5.15 L11.94 6.87 Z"/>
  <circle cx="8" cy="8" r="1.5"/>
</svg>
