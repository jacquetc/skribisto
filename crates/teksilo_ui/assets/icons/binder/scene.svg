<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter">
  <!-- Item/Scene — a dinkus over two prose bars, and no page frame.
       The dinkus is the "* * *" that separates scenes in print, so the glyph names
       the unit by its boundary. Scene used to share Chapter's framed page and differ
       only inside it; at 16px that read as two near-identical pages. Now the pair
       differs by silhouette (open vs closed outline) and by where the ink sits.
       Only text.svg (legacy fallback, never offered for creation) is also frameless
       bars; the solid dinkus row keeps them apart.
       Dinkus squares take integer bounds, 2 apart, so a whole pixel column of gap
       is left between them; bars on the half-grid. -->
  <rect x="3" y="3" width="2" height="2" fill="currentColor" stroke="none"/>
  <rect x="7" y="3" width="2" height="2" fill="currentColor" stroke="none"/>
  <rect x="11" y="3" width="2" height="2" fill="currentColor" stroke="none"/>
  <path d="M3 8.5H13"/>
  <path d="M3 11.5H11"/>
</svg>
