<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter">
  <!-- Item/Scene — framed document, two equal prose bars (no heading).
       Scene and Chapter share this frame, so the *interior* carries the whole
       distinction, and it is drawn as a difference of ink mass, not of bar count:
       two 1-unit strokes here against Chapter's one solid 2-unit band. Counting
       strokes is what a 16px raster destroys; comparing mass is what survives it.
       Bars on the half-grid, 2 apart, so a whole pixel row of gap is left. -->
  <path d="M9.5 2.5H4.5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h7a1 1 0 0 0 1-1V5.5Z"/>
  <path d="M9.5 2.5V5.5H12.5"/>
