<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter">
  <!-- Folder/Book — open book, and now the *only* open book in the set: BookBegin
       and BookEnd used to wear this same silhouette with a small bracket bolted
       to one side, which at 16px just thickened one edge. They are stream
       boundary markers, not books, so they were redrawn as a flag and an end
       mark; leave this glyph unique to the Book container.
       The spine sits at x8.5 so the one straight line in the glyph is crisp. -->
  <path d="M8.5 4C7.5 3.2 5.8 2.9 4.3 3a.8.8 0 0 0-.8.8v7.4c0 .5.4.8.9.8 1.3-.1 2.9.2 4.1.9 1.2-.7 2.8-1 4.1-.9.5 0 .9-.3.9-.8V3.8a.8.8 0 0 0-.8-.8c-1.5-.1-3.2.2-4.2 1Z"/>
  <path d="M8.5 4V12.9"/>
</svg>
