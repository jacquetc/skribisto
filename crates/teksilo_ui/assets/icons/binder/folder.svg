<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter">
  <!-- Folder/None — plain organisational folder. The tab notched into the top-left
       edge is what separates it from Binder's square-shouldered archive box, so
       keep the two silhouettes apart if either is ever redrawn. Edges sit on the
       half-grid (x2.5/x13.5, y12.5) so the box renders crisp rather than grey. -->
  <path d="M2.5 5.5V4.5a1 1 0 0 1 1-1h2l1.5 2H12.5a1 1 0 0 1 1 1V11.5a1 1 0 0 1-1 1H3.5a1 1 0 0 1-1-1Z"/>
