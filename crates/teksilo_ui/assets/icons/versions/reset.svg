<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
  <!-- Show the whole history — the counter-clockwise arrow every "put it back
       the way it was" control wears.
       Deliberately the same family as the Versions rail icon, which is this
       shape with clock hands inside it: one says "the past", this says "back to
       all of it". Bare, because there is no moment being pointed at here — the
       whole point is that no window is left. -->
  <path d="M3.4 6.9 A4.7 4.7 0 1 1 3.6 9.9"/>
  <path d="M3.4 4.1 V7.0 H6.3"/>
</svg>
