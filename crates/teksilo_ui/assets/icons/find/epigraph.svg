<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
  <!-- Epigraph — an opening quotation mark over the passage it introduces.
       Deliberately not the Body glyph with an indent: an epigraph is someone
       else's words carried at the head of a chapter, and the whole job of this
       column is to say which kind of text a hit landed in. The mark is what
       makes it a quotation rather than merely a shorter paragraph. -->
  <path d="M3.4 3.6 4.4 6.2"/>
  <path d="M6.2 3.6 7.2 6.2"/>
  <path d="M3.4 9.4 H13.4"/>
  <path d="M3.4 12.2 H10.2"/>
</svg>
