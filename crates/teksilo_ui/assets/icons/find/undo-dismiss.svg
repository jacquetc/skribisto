<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
  <!-- Bring back the last dismissal — an arrow turning back on itself.
       The undo curve rather than a second cross: what it restores is a row, and a
       glyph that mirrored Dismiss would read as dismissing something else. -->
  <path d="M3.0 7.4 A5 5 0 1 1 4.4 11.2"/>
  <path d="M2.7 4.2 3.0 7.5 6.3 7.2"/>
</svg>
