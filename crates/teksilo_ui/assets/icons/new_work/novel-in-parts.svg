<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
  <!-- Novel in parts — `novel.svg`'s plate, then a straight full-width rule where
       that icon has its first echo, then one echo below it. The rule is the whole
       difference: every other tile in this set is a plate with echoes of the same
       shape, so a *different* shape reads as a division rather than as one more
       layer. Sat on the half-grid at 9.5 like the axis-aligned strokes elsewhere,
       even though a 1.3 round-capped stroke cannot land crisply either way. -->
  <path d="M8 2.0 L13.4 4.6 L8 7.2 L2.6 4.6 Z"/>
  <path d="M2.6 9.5 L13.4 9.5"/>
  <path d="M2.6 12.2 L8 14.0 L13.4 12.2"/>
</svg>
