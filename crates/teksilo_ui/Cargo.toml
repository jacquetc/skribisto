[package]
name = "teksilo_ui"
description = "Teksilo desktop UI for Skribisto"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "../../README.md"
publish = false

# The library IS the application; the binary below is a one-line `fn main` that
# calls `run()`. A `[[bin]]`-only crate cannot be depended on, which put every
# type in this crate out of reach of anything outside the workspace.
[lib]
name = "teksilo_ui"
path = "src/lib.rs"

[[bin]]
name = "skribisto"
path = "src/bin/skribisto.rs"

# macOS packaging via cargo-packager (consumed by .github/workflows/release-macos.yml).
# `signing_identity` is deliberately ABSENT: cargo-packager codesigns only when
# it is set, so the unsigned CI path never attempts to sign with a missing
# certificate. The signed path injects the identity at build time via `--config`.
# cargo itself ignores [package.metadata.*], so this has no effect on builds.
[package.metadata.packager]
product-name = "Skribisto"
identifier = "eu.skribisto.skribisto"
category = "Productivity"
icons = [
    "../../resources/unix/icons/icons/hicolor/256x256/apps/skribisto.png",
    "../../resources/unix/icons/icons/hicolor/512x512/apps/skribisto.png",
]

# What a double-click on a .skrib opens. The packager turns this into the
# bundle's CFBundleDocumentTypes (macOS) and the association metadata of the
# formats it builds; the Windows installer (package/windows/setup.nsi) and the
# Linux MIME entry (resources/unix/mime/) declare the same pairing by hand,
# because neither is produced by the packager here.
[[package.metadata.packager.file-associations]]
extensions = ["skrib"]
mime-type = "application/vnd.skribisto.project+zip"
name = "Skribisto project"
description = "Skribisto project"
role = "editor"

[package.metadata.packager.macos]
minimum-system-version = "11.0"
# Adds the exported UTI and re-declares the document types with LSItemContentTypes
# and LSHandlerRank, neither of which the packager emits. See that file's header
# for the merge semantics — every key it names replaces the generated one.
info-plist-path = "../../package/macos/Info.plist"

[package.metadata.packager.dmg]
window-size = { width = 660, height = 400 }
app-position = { x = 180, y = 170 }
application-folder-position = { x = 480, y = 170 }

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
csv = { workspace = true }
serde = { workspace = true }
# Parse the LongOperation event payloads (id/percentage/message/error JSON) that
# drive the import progress toast.
serde_json = "1.0"
# Lenient deserialize of the per-work `workspace.toml`'s embedded `DockLayoutState`
# (teksilo's dock-layout snapshot): a future non-additive change to that *external*
# type would otherwise fail-load the whole file for every project — so its blob is
# parsed via a `toml::Value` and dropped to `None` on error. Matches the version
# teksilo-settings already resolves.
toml = "1.1.3"
frontend = { workspace = true }
skribisto_model = { workspace = true }
# The import review tree binds to `document_ingest`'s plan directly: the panel
# edits a plan in memory, and only the accepted rows ever reach a use case.
document_ingest = { workspace = true }
binder_ordering = { workspace = true }
# Direct edge (bypassing the generated `frontend` crate) for the backup settings'
# retention policy type + the retention/fingerprint/sniff helpers used by the
# backup scheduler, backups list, and open-a-backup flow.
skrib_format = { workspace = true }
common = { workspace = true }
# The durable per-row identity (`BinderItem.uid` / `Binder.uid`) is a real
# `uuid::Uuid`, and the Overview table keys its tree — and, later, its persisted
# expand state — on it. Naming the crate here lets the UI hold the typed value
# instead of stringifying it at the boundary; it is already in the tree via
# `common`, so this adds a name, not a dependency.
uuid = { workspace = true }
# The export compiler (Preset schema + built-in styles + one-TextDocument assembly)
# drives the Export panel's live preview *client-side* — the same code path the
# `export_work` long op runs, so preview and committed export cannot diverge.
skribisto_compiler = { workspace = true }
skribisto_fonts = { workspace = true }
# The `export_work` DTO + its `ExportFormat` / `ExportScopeKind` enums, carried by the
# `export.scope` intent and dispatched from the Export panel.
export_management = { workspace = true }
# Stable content hash for the per-project window-persistence id
# (`windows::window_id_for`). NOT `std::hash::DefaultHasher`: its output is
# explicitly not guaranteed stable across Rust releases, and this id is
# *persisted* as the key for a project's saved window geometry — a toolchain
# bump would silently orphan every one of them. Already in the tree via
# `skrib_format` (the `.skrib` content fingerprint), so this costs nothing.
blake3 = "1"
# Re-encoding an optimised image: PNG is lossless, so optimising twice cannot
# degrade a picture the way repeated JPEG re-encoding would.
png = "0.18"
# Parse the compiled-in dictionary registry (`assets/dictionaries/registry.ron`)
# and the accepted-licences settings file. `skrib_format` pins its own `ron` and
# re-exports nothing, so this is a real (one-line) edge, not a free ride.
ron = "0.12.2"
# Dictionary downloads: a blocking HTTP GET on a `spawn_blocking` worker thread
# (no async runtime needed). `ureq` 3 ships rustls by default — no OpenSSL
# system-ABI dependency, which matters for a Flatpak/AppImage build where the
# host's OpenSSL is unpredictable. Already resolved in the workspace lockfile at
# 3.3.0, so this names an existing edge.
ureq = "3"
# Extract the three French variants from grammalecte.net's single shared zip
# (the `ZipMember` registry source). Locked at 0.6.6 already (transitive), so no
# new version enters the tree.
zip = "8.6.0"
# The spell-checker itself — a pure-Rust, Hunspell-compatible engine (no C++
# toolchain, no system library, MPL-2.0). Fed the same `.aff`/`.dic` a hunspell
# dictionary ships.
spellbook = "0.4"
# The misspelling predicate and suggestion ranking, store- and widget-free.
spellcheck_engine = { workspace = true }
# UAX#29 word segmentation — spellbook delegates tokenisation to the caller, and
# a naive `split_whitespace` would butcher accented words and contractions.
unicode-segmentation = "1"
# Transcode a system dictionary that declares a legacy 8-bit encoding (`SET
# ISO8859-1`) to UTF-8 before spellbook, which takes `&str` and does not itself
# honour the `.aff` `SET` directive. Our own downloads are UTF-8, so this only
# ever runs on tier-2 system dictionaries.
encoding_rs = "0.8"
# `automation` enables the debug-only in-app automation bridge
# (`install_automation_bridge_in_debug()`); a no-op in release. `async` enables
# the main-thread async executor (`ctx.spawn_local`/`spawn_local_with` +
# `spawn_blocking`) — the sanctioned way to get pure-filesystem work (backup
# sniffing, destination-reachability probes) off the UI thread without
# reaching for the Qleany `LongOperation` machinery, which is for backend
# store operations, not local I/O.
# `async-std` (not the bare `async`): it implies `async`, and async-std is
# *already* in our dependency tree via the default `file-dialog` feature (rfd).
# So the reactor is free — same binary, strictly more capability. Bare `async`
# would install an executor with **no reactor**, which works for our
# `spawn_blocking`-only futures but silently never wakes if anything ever awaits
# a native future (a timer, a socket) — a runtime hang, not a compile error.
teksilo = { version = "0.9.2", features = [
    "automation",
    "async-std",
    # The sibling design-language presets, selectable at launch with `--style`
    # (see `crate::style`). Each is its own crate behind its own feature —
    # without these three `teksilo::prelude::{fluent,material3,macos}` do not
    # exist — and the app's default stays the built-in IntUI preset, which
    # needs no feature at all.
    #
    # `theme-fluent/system-fonts` is deliberately NOT forwarded: Segoe UI
    # Variable is proprietary and unresolvable off Windows, so the
    # metric-neutral bundled Inter stays.
    "theme-fluent",
    "theme-material3",
    "theme-macos",
] }
# The Pace planner's progression / words-per-day charts (not re-exported by the
# umbrella crate — a direct dependency, like the example widget catalog).
teksilo-charts = { version = "0.9.2" }
# Calendar dates for the Pace end-date + weekday picker (the teksilo date widgets
# speak `jiff::civil::Date`); `date_convert` bridges it to the entities' chrono.
jiff = "0.2"
# Cross-instance IPC (multi-process window switching): Unix domain socket on
# Linux/macOS, named pipe on Windows — one API.
interprocess = "2"
# Hand a URL to the OS default handler — the Welcome sidebar's GitHub / Discord
# links (`WelcomeViewModel::open_link`). Already in the tree via
# `teksilo-widgets` (rich tooltips open their `http(s)` links the same way), so
# this edge adds no new dependency, only a name for it.
open = "5.3"
similar = { version = "3", features = ["unicode"] }

# Heap profiler with call-site attribution, behind the `dhat-heap` feature.
# Optional, so a default build neither compiles nor links it.
dhat = { version = "0.3", optional = true }

# Alternative general-purpose allocator, behind the `mimalloc` feature.
mimalloc = { version = "0.1", optional = true, default-features = false }

# Unresolved stack capture for `memprof`'s large-allocation attribution. The
# `backtrace` crate rather than `std::backtrace` because only it separates
# *capturing* a stack (cheap: a walk, a few pointers) from *symbolising* one
# (expensive: DWARF, one binary-wide index). Capture happens per allocation;
# symbolisation happens once, at the dump.
backtrace = { version = "0.3", optional = true }

# PID-liveness check for reaping stale open-registry locks.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

# Embed the app icon (taskbar / exe / installer) + version metadata as Win32
# resources via build.rs. Maintained successor to the abandoned `winres`.
#
# Deliberately NOT under [target.'cfg(windows)'.build-dependencies]: for a
# build-dependency that cfg() is evaluated against the HOST, and the Windows
# release is cross-compiled from Linux, where the crate would then be dropped
# entirely and the exe would ship unbranded. build.rs gates on the target via
# CARGO_CFG_TARGET_OS instead, so for non-Windows targets this is built but
# never called. winit 0.30 sets PerMonitorV2 DPI awareness programmatically, so
# no application manifest is needed here.
[build-dependencies]
winresource = "0.1"

[features]
# Build-with-mocks: render the UI with fabricated data, no real backend needed.
mocks = []
# Diagnostic traces, compiled out unless asked for: the margin lane's per-recompute
# timing (`TEKSILO_LANE_DEBUG`), the search tree's fetch trace
# (`TEKSILO_SEARCH_DEBUG`), and the toolkit's height-guess trace
# (`TEKSILO_HEIGHT_DEBUG`). The feature makes them available; the environment
# variable makes them loud. Off by default because a shipped build should carry
# neither the formatting nor the lookup, and both the lane's and the editor's sit
# on a layout path that runs every dirty frame.
debug-traces = ["teksilo/debug-traces"]
# Heap instrumentation for the memory investigation: a counting global allocator
# plus a sampler thread writing a CSV timeline (see `src/memprof.rs`). Off by
# default because a shipped build has no business counting every allocation; the
# two relaxed atomics per malloc are cheap but not free.
memprof = ["dep:backtrace"]

# Call-site attribution for the same investigation, via the `dhat` crate: every
# live block at exit is reported with the backtrace that allocated it, which is
# the half a counter cannot answer ("50 MB is still held", by what?). Mutually
# exclusive with `memprof`: a process has one global allocator.
dhat-heap = ["dep:dhat"]

# Swap glibc malloc for mimalloc. Independent of `memprof`: with both on, the
# counting allocator forwards to mimalloc instead of the system allocator, so the
# same timeline can be read against either. Exists to answer, with numbers rather
# than folklore, how much of the RSS that never comes back is glibc's arena
# retention. mimalloc returns freed pages to the OS on its own schedule, where
# glibc only trims the top of an arena.
mimalloc = ["dep:mimalloc"]

# Opt-in PDF export (embedded Typst). OFF by default so the standard build carries no Typst
# dependency (~34 MB / ~60 s); the shipping/release build turns it on. When off, choosing PDF
# in the export panel fails with a "PDF support not compiled" error rather than being absent.
pdf = ["skribisto_compiler/pdf"]

[dev-dependencies]
# Import-panel validation tests probe the filesystem for an existing target.
tempfile = "3"
# `WidgetId` is a slotmap key. The formatting registry is keyed on one, so its
# headless tests need to mint a couple of distinct ids without standing up a
# whole `WidgetTree`. Already in the lockfile via teksilo-core — no new crate.
slotmap = "1"

[lints]
workspace = true
