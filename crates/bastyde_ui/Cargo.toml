[package]
name = "bastyde_ui"
description = "Bastyde desktop UI for Skribisto"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "../../README.md"
publish = false

[[bin]]
name = "skribisto"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
# Parse the LongOperation event payloads (id/percentage/message/error JSON) that
# drive the import progress toast.
serde_json = "1.0"
frontend = { workspace = true }
skribisto_model = { workspace = true }
# `automation` enables the debug-only in-app automation bridge
# (`install_automation_bridge_in_debug()`); a no-op in release.
bastyde = { path = "../../../bastyde/crates/bastyde", features = ["automation"] }
# Cross-instance IPC (multi-process window switching): Unix domain socket on
# Linux/macOS, named pipe on Windows — one API.
interprocess = "2"

# PID-liveness check for reaping stale open-registry locks.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[features]
# Build-with-mocks: render the UI with fabricated data, no real backend needed.
mocks = []

[dev-dependencies]
# Import-panel validation tests probe the filesystem for an existing target.
tempfile = "3"

[lints]
workspace = true
