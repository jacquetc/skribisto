[package]
name = "bastyde_ui"
description = "Bastyde desktop UI for Skribisto"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "../../README.md"
publish = false

[[bin]]
name = "skribisto"
path = "src/main.rs"

# macOS packaging via cargo-packager (consumed by .github/workflows/release-macos.yml).
# `signing_identity` is deliberately ABSENT: cargo-packager codesigns only when
# it is set, so the unsigned CI path never attempts to sign with a missing
# certificate. The signed path injects the identity at build time via `--config`.
# cargo itself ignores [package.metadata.*], so this has no effect on builds.
[package.metadata.packager]
product-name = "Skribisto"
identifier = "eu.skribisto.skribisto"
category = "Productivity"
icons = [
    "../../resources/unix/icons/icons/hicolor/256x256/apps/skribisto.png",
    "../../resources/unix/icons/icons/hicolor/512x512/apps/skribisto.png",
]

[package.metadata.packager.macos]
minimum-system-version = "11.0"

[package.metadata.packager.dmg]
window-size = { width = 660, height = 400 }
app-position = { x = 180, y = 170 }
application-folder-position = { x = 480, y = 170 }

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
# Parse the LongOperation event payloads (id/percentage/message/error JSON) that
# drive the import progress toast.
serde_json = "1.0"
# Lenient deserialize of the per-work `workspace.toml`'s embedded `DockLayoutState`
# (bastyde's dock-layout snapshot): a future non-additive change to that *external*
# type would otherwise fail-load the whole file for every project — so its blob is
# parsed via a `toml::Value` and dropped to `None` on error. Matches the version
# bastyde-settings already resolves.
toml = "0.8"
frontend = { workspace = true }
skribisto_model = { workspace = true }
binder_ordering = { workspace = true }
# Direct edge (bypassing the generated `frontend` crate) for the backup settings'
# retention policy type + the retention/fingerprint/sniff helpers used by the
# backup scheduler, backups list, and open-a-backup flow.
skrib_format = { workspace = true }
common = { workspace = true }
# The durable per-row identity (`BinderItem.uid` / `Binder.uid`) is a real
# `uuid::Uuid`, and the Overview table keys its tree — and, later, its persisted
# expand state — on it. Naming the crate here lets the UI hold the typed value
# instead of stringifying it at the boundary; it is already in the tree via
# `common`, so this adds a name, not a dependency.
uuid = { workspace = true }
# The export compiler (Preset schema + built-in styles + one-TextDocument assembly)
# drives the Export panel's live preview *client-side* — the same code path the
# `export_work` long op runs, so preview and committed export cannot diverge.
skribisto_compiler = { workspace = true }
skribisto_fonts = { workspace = true }
# The `export_work` DTO + its `ExportFormat` / `ExportScopeKind` enums, carried by the
# `export.scope` intent and dispatched from the Export panel.
export_management = { workspace = true }
# Stable content hash for the per-project window-persistence id
# (`windows::window_id_for`). NOT `std::hash::DefaultHasher`: its output is
# explicitly not guaranteed stable across Rust releases, and this id is
# *persisted* as the key for a project's saved window geometry — a toolchain
# bump would silently orphan every one of them. Already in the tree via
# `skrib_format` (the `.skrib` content fingerprint), so this costs nothing.
blake3 = "1"
# Parse the compiled-in dictionary registry (`assets/dictionaries/registry.ron`)
# and the accepted-licences settings file. `skrib_format` pins its own `ron` and
# re-exports nothing, so this is a real (one-line) edge, not a free ride.
ron = "0.8"
# Dictionary downloads: a blocking HTTP GET on a `spawn_blocking` worker thread
# (no async runtime needed). `ureq` 3 ships rustls by default — no OpenSSL
# system-ABI dependency, which matters for a Flatpak/AppImage build where the
# host's OpenSSL is unpredictable. Already resolved in the workspace lockfile at
# 3.3.0, so this names an existing edge.
ureq = "3"
# Extract the three French variants from grammalecte.net's single shared zip
# (the `ZipMember` registry source). Locked at 0.6.6 already (transitive), so no
# new version enters the tree.
zip = "0.6"
# The spell-checker itself — a pure-Rust, Hunspell-compatible engine (no C++
# toolchain, no system library, MPL-2.0). Fed the same `.aff`/`.dic` a hunspell
# dictionary ships.
spellbook = "0.4"
# UAX#29 word segmentation — spellbook delegates tokenisation to the caller, and
# a naive `split_whitespace` would butcher accented words and contractions.
unicode-segmentation = "1"
# Transcode a system dictionary that declares a legacy 8-bit encoding (`SET
# ISO8859-1`) to UTF-8 before spellbook, which takes `&str` and does not itself
# honour the `.aff` `SET` directive. Our own downloads are UTF-8, so this only
# ever runs on tier-2 system dictionaries.
encoding_rs = "0.8"
# `automation` enables the debug-only in-app automation bridge
# (`install_automation_bridge_in_debug()`); a no-op in release. `async` enables
# the main-thread async executor (`ctx.spawn_local`/`spawn_local_with` +
# `spawn_blocking`) — the sanctioned way to get pure-filesystem work (backup
# sniffing, destination-reachability probes) off the UI thread without
# reaching for the Qleany `LongOperation` machinery, which is for backend
# store operations, not local I/O.
# `async-std` (not the bare `async`): it implies `async`, and async-std is
# *already* in our dependency tree via the default `file-dialog` feature (rfd).
# So the reactor is free — same binary, strictly more capability. Bare `async`
# would install an executor with **no reactor**, which works for our
# `spawn_blocking`-only futures but silently never wakes if anything ever awaits
# a native future (a timer, a socket) — a runtime hang, not a compile error.
bastyde = { path = "../../../bastyde/crates/bastyde", version = "0.6.2", features = [
    "automation",
    "async-std",
] }
# The Pace planner's progression / words-per-day charts (not re-exported by the
# umbrella crate — a direct dependency, like the example widget catalog).
bastyde-charts = { path = "../../../bastyde/crates/bastyde-charts", version = "0.6.2" }
# Calendar dates for the Pace end-date + weekday picker (the bastyde date widgets
# speak `jiff::civil::Date`); `date_convert` bridges it to the entities' chrono.
jiff = "0.2"
# Cross-instance IPC (multi-process window switching): Unix domain socket on
# Linux/macOS, named pipe on Windows — one API.
interprocess = "2"
# Hand a URL to the OS default handler — the Welcome sidebar's GitHub / Discord
# links (`WelcomeViewModel::open_link`). Already in the tree via
# `bastyde-widgets` (rich tooltips open their `http(s)` links the same way), so
# this edge adds no new dependency, only a name for it.
open = "5.3"

# PID-liveness check for reaping stale open-registry locks.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

# Embed the app icon (taskbar / exe / installer) + version metadata as Win32
# resources via build.rs. Maintained successor to the abandoned `winres`. Only
# pulled in when building on a Windows host (the release target is built
# natively on windows-latest), so Linux/macOS builds skip it. winit 0.30 sets
# PerMonitorV2 DPI awareness programmatically, so no application manifest is
# needed here.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
# Build-with-mocks: render the UI with fabricated data, no real backend needed.
mocks = []
# Opt-in PDF export (embedded Typst). OFF by default so the standard build carries no Typst
# dependency (~34 MB / ~60 s); the shipping/release build turns it on. When off, choosing PDF
# in the export panel fails with a "PDF support not compiled" error rather than being absent.
pdf = ["skribisto_compiler/pdf"]

[dev-dependencies]
# Import-panel validation tests probe the filesystem for an existing target.
tempfile = "3"

[lints]
workspace = true
