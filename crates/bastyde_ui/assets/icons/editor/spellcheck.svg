<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Spell-check on — one letter over a wavy underline, with a check badge.
       The "B" that used to sit beside the "A" cost the glyph its legibility:
       two letters, a squiggle and a check inside 16px left every counter under
       a pixel wide. One letter is enough to say "words", and the badge corner
       is the same one `save-saved.svg` uses. -->
