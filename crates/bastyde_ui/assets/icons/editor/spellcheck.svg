  <path d="M3.2 6.7 H7.2"/>
  <path stroke-width="1.1" d="M1.8 12.3 q1.6 -1.8 3.2 0 t3.2 0"/>
  <path d="M9.8 11.5 L11.5 13.3 L14.7 9.5"/>
</svg>
