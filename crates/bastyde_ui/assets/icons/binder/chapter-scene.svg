<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Item/ChapterScene — framed document, heading bar + body line
       (opens_chapter && carries_scene). Two bars of different length, not three
       bars 1.7 apart: at 16px a 1.2 stroke leaves half a pixel between those and
       the block fills in. The long bar is the heading, the short one the prose —
       which is also what tells this apart from `scene.svg`'s two equal bars. -->
  <path d="M9 2.5H4.5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h7a1 1 0 0 0 1-1V6z"/>
  <path d="M9 2.5V6h3.5"/>
