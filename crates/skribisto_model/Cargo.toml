# Hand-written (NOT generated by Qleany). Domain rules for the writing model.
[package]
name = "skribisto-model"
description = "Writing-model domain rules (role / sub_role / content-role constraints) for Skribisto"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "../../README.md"
publish = false

[lib]
name = "skribisto_model"

[dependencies]
common = { workspace = true }
text-document = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
# `round_trip` mints and reads the bookmark names that carry a `BinderItem`/`Comment` uid
# through a `.docx`/`.odt` and back. Same crate + feature set `common`'s own entities use.
uuid = { workspace = true }
# The analysis tokenizer: one UAX #29 word definition shared by every repetition and
# vocabulary measure, so they cannot disagree about what a word is.
unicode-segmentation = "1"

[dev-dependencies]
# Most of this crate is pure functions over arbitrary prose, which is exactly the shape a
# table of examples under-tests: a comment that must not move, a number that must not depend
# on what an export selected, two engines that must not panic on any keystroke in any script.
# See `src/property_tests.rs`.
proptest = { workspace = true }

[lints]
workspace = true
