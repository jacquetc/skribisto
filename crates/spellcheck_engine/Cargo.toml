[package]
name = "skribisto-spellcheck-engine"
description = "Hunspell-backed misspelling predicate and suggestion ranking, free of any UI"
authors.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
version.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme = "../../README.md"
publish = true

[lib]
name = "spellcheck_engine"
path = "src/lib.rs"

[dependencies]
spellbook = "0.4"
# `.aff` files declare their own encoding (`SET ISO8859-1`); spellbook takes
# `&str` and does not transcode, so the pair is decoded before it is handed over.
encoding_rs = "0.8"
# UAX#29 word segmentation — spellbook delegates tokenisation to the caller, and
# the same tokenizer has to answer "what is flagged" and "what is addable".
unicode-segmentation = "1"

[dev-dependencies]
# Three pieces of ordinary arithmetic on the path a writer takes hundreds of times a
# page: a hand-rolled byte/character cursor whose offsets the squiggle is drawn at, a
# distance with a bail-out, and a budget with reserved slots. See `tests/properties.rs`.
proptest = { workspace = true }
