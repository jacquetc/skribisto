# Hand-written (NOT generated by Qleany). RTF bytes in, a small document model out:
# paragraphs of styled runs, tables, fields, notes, annotations and pictures, with
# every loss counted. A leaf crate with no Skribisto type in it, so that "the reader
# knows RTF and nothing else" is a fact the compiler checks: the Scrivener dialect
# (inline notes and style markers written as text) is read by the layer above it, and
# the mapping onto `document_ingest`'s rich model lives in that crate's `rtf` feature.
[package]
name = "skribisto-rtf-reader"
description = "Reads RTF bytes into a small document model, bounded and without recursion"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "../../README.md"
publish = false

[lib]
name = "rtf_reader"

[dependencies]
# Code-page bytes (`\'hh` and raw 8-bit text) to Unicode. Already in the tree for the
# same job: `document_ingest` decodes BOM-declared text with it and `spellcheck_engine`
# a Hunspell file's declared `SET`. The pages it lacks (437, 850, Symbol) are tables here.
encoding_rs = "0.8"

[dev-dependencies]
# The reader's contract is a statement about every input, not about the fixtures: it
# never panics, never exceeds its limits, and reads back what a writer wrote. See
# `tests/properties.rs`.
proptest = { workspace = true }

[lints]
workspace = true
