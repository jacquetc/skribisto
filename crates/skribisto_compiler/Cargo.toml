# Hand-written (NOT generated by Qleany). Folds an export scope into one
# `text_document::TextDocument` and renders it to each output format. The only
# place a TextDocument is built for export; shared by the backend `export_work`
# use case (commit) and `teksilo_ui` (client-side live preview).
[package]
name = "skribisto-compiler"
description = "Compile an export scope into one TextDocument and render it to each output format"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "../../README.md"
publish = false

[lib]
name = "skribisto_compiler"

[dependencies]
anyhow = { workspace = true }
common = { workspace = true }
skribisto_model = { workspace = true }
skrib_format = { workspace = true }
serde = { workspace = true }
serde_json = "1.0"
# `BinderItem.uid`, carried into a round-trip row mark so a returning `.docx`/`.odt` can be
# matched back onto the rows it came from. Same crate + feature set `common`'s entities use.
uuid = { workspace = true }
text-document = { workspace = true }
skribisto_fonts = { workspace = true }
# Bundled Noto RTL faces for PDF export (byte accessors only). Explicit features so the
# accessors always exist regardless of feature unification.
teksilo-text = { path = "../../../teksilo/crates/teksilo-text", version = "0.9.1", features = ["fonts-arabic", "fonts-hebrew"] }

[dev-dependencies]
tempfile = "3"
png = "0.18"
# Reading a packed `.docx`/`.odt` back to prove a round-trip mark reached the file rather than
# only the payload. Dev-only: the writers themselves live in text-document.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[features]
# Opt-in: enables text-document's Typst-backed PDF exporter. Off by default so the standard
# build carries no Typst dependency; `teksilo_ui`'s own `pdf` feature turns this on.
pdf = ["text-document/pdf"]

[lints]
workspace = true
