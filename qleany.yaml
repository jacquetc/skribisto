---
schema:
  version: 5
global:
  language: rust
  application_name: Skribisto
  organisation:
    name: skribisto
    domain: skribisto.eu
  prefix_path: crates
entities:
- name: EntityBase
  only_for_heritage: true
  fields:
  - name: id
    type: uinteger
  - name: created_at
    type: datetime
  - name: updated_at
    type: datetime
  undoable: true
- name: Root
  inherits_from: EntityBase
  fields:
  - name: system
    type: entity
    entity: System
    relationship: one_to_one
    strong: true
  - name: works
    type: entity
    entity: Work
    relationship: one_to_many
    strong: true
  undoable: false
- name: System
  inherits_from: EntityBase
  fields:
  - name: recent_works
    type: entity
    entity: RecentWork
    relationship: ordered_one_to_many
    strong: true
    list_model: true
    list_model_displayed_field: title
  - name: work_infos
    type: entity
    entity: WorkInfo
    relationship: one_to_many
    strong: true
  undoable: false
- name: WorkInfo
  inherits_from: EntityBase
  fields:
  - name: file_name
    type: string
    optional: true
  - name: shape
    type: enum
    enum_name: WorkShape
    enum_values:
      - Zip
      - Folder
  - name: work
    type: entity
    entity: Work
    relationship: many_to_one
    optional: true
  - name: search
    type: entity
    entity: Search
    relationship: one_to_one
    strong: true
  - name: progress_snapshots
    type: entity
    entity: ProgressSnapshot
    relationship: ordered_one_to_many
    strong: true
    list_model: true
    list_model_displayed_field: day
  undoable: false
# The daily writing-progress history (words per day). Hangs off WorkInfo and is
# `undoable: false` — you don't Ctrl+Z a fact about what you wrote yesterday, and it must
# never enter the manuscript's undo history. UNLIKE the search surface, though, this DOES
# round-trip through the .skrib (a `snapshots.ron`, hydrated onto the fresh WorkInfo on
# load) so a writer's streak survives moving the project — the first `undoable: false`
# entity that is also persisted. `day` is truncated to UTC midnight by the writer;
# `book_item_ids`/`book_word_counts` are index-paired parallel arrays (a per-Book
# breakdown, almost always length-1).
- name: ProgressSnapshot
  inherits_from: EntityBase
  fields:
  - name: day
    type: datetime
  - name: total_word_count
    type: integer
  - name: total_char_count
    type: integer
    optional: true
  - name: book_item_ids
    type: uinteger
    is_list: true
  - name: book_word_counts
    type: integer
    is_list: true
  undoable: false
# The live search surface. It hangs off WorkInfo (not Work) and is `undoable: false`
# deliberately: WorkInfo has no per-instance undo stack the way Work does, and a
# result set that is re-derived on every keystroke must never enter the manuscript's
# Ctrl+Z history. `undoable: false` also means run_search never snapshots the entity
# tree, so `remove_multi` genuinely frees the old rows instead of retaining them.
#
# It is the *business surface*, not a persistence bet: the store is an ephemeral
# HashMap and WorkInfo never round-trips through .skrib, so the search PARAMETERS
# that must survive a restart live in `search.toml` (see models/search_settings_file.rs),
# not here.
- name: Search
  single_model: true
  inherits_from: EntityBase
  fields:
  - name: query
    type: string
  - name: case_sensitive
    type: boolean
  - name: whole_word
    type: boolean
  - name: diacritic_sensitive
    type: boolean
  # Which KINDS of thing to show results from — the six SearchFacet chips, as
  # skribisto_model::SearchFacet::code() values.
  #
  # EMPTY means no filter (all kinds), which is what a filter with nothing ticked means to a
  # reader. A code naming no facet is ignored — and if NONE of the codes name a facet, the
  # whole list is ignored, i.e. it is no filter at all. Dropping unknown codes one at a time
  # is not enough: a search.toml written by a version whose codes differed would otherwise
  # leave a non-empty list that matches nothing, and the writer would open the search panel
  # to zero results with no error anywhere.
  - name: facets
    type: integer
    is_list: true
  - name: search_body
    type: boolean
  - name: search_titles
    type: boolean
  - name: search_synopsis
    type: boolean
  - name: search_labels
    type: boolean
  - name: include_trashed
    type: boolean
  - name: truncated
    type: boolean
  - name: results
    type: entity
    entity: SearchResult
    relationship: ordered_one_to_many
    strong: true
  undoable: false
# One row per matching FIELD (a scene's body, its synopsis, an item's title…), not
# per occurrence — `occurrence_count` carries the rest. Per-occurrence review happens
# in the preview pane, recomputed live from the item's own document.
#
# Deliberately carries NO character offsets. There are three distinct offset spaces
# in play (bytes into raw Djot, chars into parsed plain text, and the editor's own
# char space); a stored offset from one silently corrupts an operation in another,
# and it goes stale the moment anything before it is edited. Positions are always
# re-derived fresh, inside one just-parsed document.
- name: SearchResult
  inherits_from: EntityBase
  fields:
  # A PLAIN id, deliberately not an `entity` relationship.
  #
  # A weak many_to_one would make Qleany generate a reverse join table on BinderItem,
  # whose backing field lives in the hand-edited `common/src/database/hashmap_store.rs`
  # — so wiring it would force a regen of a file that carries hand-written changes,
  # for no benefit. A SearchResult is a *projection*, not a relational citizen: it is
  # re-derived on every search and every activation re-validates it against the live
  # document, so a stale id is caught there and costs nothing. Referential integrity
  # would be machinery guarding a value we never trust anyway.
  - name: binder_item_id
    type: uinteger
  - name: item_title
    type: string
  - name: match_field
    type: enum
    enum_name: MatchField
    enum_values:
      - Body
      - Title
      - Synopsis
      - Label
  - name: occurrence_count
    type: uinteger
  - name: snippet_before
    type: string
  - name: snippet_match
    type: string
  - name: snippet_after
    type: string
  - name: trashed
    type: boolean
  undoable: false
- name: RecentWork
  inherits_from: EntityBase
  fields:
  - name: title
    type: string
  - name: last_opened_at
    type: datetime
  - name: absolute_path
    type: string
  undoable: false
- name: Work
  single_model: true
  inherits_from: EntityBase
  fields:
  - name: title
    type: string
  - name: author_name
    type: string
  - name: dict_language
    type: string
  - name: unique_id
    type: string
  - name: chapter_mode
    type: enum
    enum_name: ChapterMode
    enum_values:
      - Folder
      - Flat
  - name: binders
    type: entity
    entity: Binder
    relationship: ordered_one_to_many
    strong: true
    list_model: true
    list_model_displayed_field: name
  - name: tags
    type: entity
    entity: BinderTag
    relationship: one_to_many
    strong: true
    list_model: true
    list_model_displayed_field: name
  - name: dict_words
    type: entity
    entity: DictWord
    relationship: one_to_many
    strong: true
  - name: trash_infos
    type: entity
    entity: TrashInfo
    relationship: one_to_many
    strong: true
    list_model: true
    list_model_displayed_field: trashed_at
  - name: paces
    type: entity
    entity: Pace
    relationship: ordered_one_to_many
    strong: true
    list_model: true
    list_model_displayed_field: start_date
  undoable: true
- name: TrashInfo
  inherits_from: EntityBase
  fields:
  - name: trashed_at
    type: datetime
  - name: origin_binder_id
    type: integer
  - name: trashed_binder
    type: entity
    entity: Binder
    relationship: many_to_one
    optional: true
  - name: trashed_binder_item
    type: entity
    entity: BinderItem
    relationship: many_to_one
    optional: true
  undoable: true
# The per-Book writing plan ("Pace"): a target word count (read through `book_item`'s
# `word_count_goal`, never duplicated), a date range, which weekdays count, plus child
# Holiday (skipped days) and Milestone (per Part/Chapter deadline) collections. On the
# Work undo trunk, so editing a deadline is undoable and travels in the .skrib.
- name: Pace
  inherits_from: EntityBase
  fields:
  - name: book_item
    type: entity
    entity: BinderItem
    relationship: many_to_one
    optional: true
  - name: start_date
    type: datetime
  - name: end_date
    type: datetime
  # Bit set of counted weekdays: Mon=1, Tue=2, Wed=4, Thu=8, Fri=16, Sat=32, Sun=64.
  # The UI sets it explicitly (a fresh Pace defaults to 0 = no writing days).
  - name: weekday_mask
    type: integer
  - name: active
    type: boolean
  - name: holidays
    type: entity
    entity: Holiday
    relationship: ordered_one_to_many
    strong: true
    list_model: true
    list_model_displayed_field: label
  - name: milestones
    type: entity
    entity: Milestone
    relationship: ordered_one_to_many
    strong: true
    list_model: true
    list_model_displayed_field: label
  undoable: true
# A stretch of days the writer does not write — excluded from the pace schedule.
- name: Holiday
  inherits_from: EntityBase
  fields:
  - name: label
    type: string
  - name: start_date
    type: datetime
  - name: end_date
    type: datetime
    optional: true
  undoable: true
# A per-Part/Chapter deadline shown in the Book's Pace view. Weakly references the target
# BinderItem (no strong ownership: deleting the item must not cascade-delete the Pace).
- name: Milestone
  inherits_from: EntityBase
  fields:
  - name: label
    type: string
  - name: target_item
    type: entity
    entity: BinderItem
    relationship: many_to_one
    optional: true
  - name: target_date
    type: datetime
  - name: target_word_count
    type: integer
    optional: true
  undoable: true
- name: Binder
  single_model: true
  inherits_from: EntityBase
  fields:
  - name: name
    type: string
  - name: activated
    type: boolean
  - name: binder_items
    type: entity
    entity: BinderItem
    relationship: ordered_one_to_many
    strong: true
    list_model: true
    list_model_displayed_field: title
  undoable: true
- name: BinderItem
  single_model: true
  inherits_from: EntityBase
  fields:
  - name: title
    type: string
  - name: sub_title
    type: string
  - name: role
    type: enum
    enum_name: BinderItemRole
    enum_values:
      - Item
      - Folder
  - name: sub_role
    type: enum
    enum_name: BinderItemSubRole
    # A chapter is `ChapterScene` in both encodings — `Item/ChapterScene` (extent by
    # marker) and `Folder/ChapterScene` (extent by containment). There is no separate
    # `Chapter` value: a chapter always carries its own prose slot, so the two
    # encodings differ only on the UI-only `role` axis.
    enum_values:
      - Text
      - None
      - Note
      - Book
      - Part
      - Scene
      - ChapterScene
      - BookBegin
      - BookEnd
  - name: label
    type: string
  - name: activated
    type: boolean
  - name: is_favorite
    type: boolean
  - name: is_exportable
    type: boolean
  - name: indent
    type: integer
  - name: word_count_goal
    type: integer
  - name: char_count_goal
    type: integer
  - name: dict_language
    type: string
  - name: contents
    type: entity
    entity: Content
    relationship: one_to_many
    strong: true
  - name: references
    type: entity
    entity: BinderItem
    relationship: many_to_many
  - name: tags
    type: entity
    entity: BinderTag
    relationship: many_to_many
    list_model: true
    list_model_displayed_field: name
  undoable: true
- name: BinderTag
  inherits_from: EntityBase
  fields:
  - name: name
    type: string
  - name: color
    type: string
  - name: text_color
    type: string
  undoable: true
- name: Content
  single_model: true
  inherits_from: EntityBase
  fields:
  - name: activated
    type: boolean
  - name: role
    type: enum
    enum_name: ContentRole
    enum_values:
      - SceneText
      - NoteText
      - SynopsisText
      - BookTitle
      - BookSubtitle
      - PartTitle
      - ChapterTitle
  - name: data
    type: string
  undoable: true
- name: DictWord
  inherits_from: EntityBase
  fields:
  - name: word
    type: string
  undoable: true
features:
- name: work_management
  use_cases:
  - name: load_work
    entities:
    - Root
    - System
    - RecentWork
    - WorkInfo
    - Search
    - Work
    - TrashInfo
    - Binder
    - BinderItem
    - BinderTag
    - Content
    - DictWord
    undoable: false
    dto_in:
      name: LoadWorkDto
      fields:
      - name: file_name
        type: string
  - name: save_work
    entities:
    - Work
    - Binder
    - BinderItem
    - BinderTag
    - Content
    - DictWord
    - TrashInfo
    - WorkInfo
    undoable: false
    read_only: true
    long_operation: true
    dto_in:
      name: SaveWorkDto
      fields:
      - name: file_name
        type: string
      - name: overwrite
        type: boolean
    dto_out:
      name: SaveResultDto
      fields:
      - name: output_path
        type: string
  - name: save_as
    entities:
    - Work
    - Binder
    - BinderItem
    - BinderTag
    - Content
    - DictWord
    - TrashInfo
    - WorkInfo
    undoable: false
    read_only: true
    long_operation: true
    dto_in:
      name: SaveAsDto
      fields:
      - name: file_name
        type: string
      - name: as_folder
        type: boolean
    dto_out:
      name: SaveAsResultDto
      fields:
      - name: output_path
        type: string
  - name: backup_now
    entities:
    - Work
    - Binder
    - BinderItem
    - BinderTag
    - Content
    - DictWord
    - TrashInfo
    - WorkInfo
    undoable: false
    read_only: true
    long_operation: true
    dto_in:
      name: BackupNowDto
      fields:
      # Destination directories. Empty ⇒ back up next to the project (back-compat).
      - name: directories
        type: string
        is_list: true
      # Per-destination last-known content hash (parallel to `directories`); an
      # empty entry means "no known hash" ⇒ never skipped. Enables skip-if-unchanged.
      - name: last_known_hashes
        type: string
        is_list: true
      # Per-destination last-known written path (parallel to `directories`); a
      # skip is only honoured when this path still exists on disk — otherwise the
      # backup is gone (deleted folder, reformatted stick) and must be rewritten
      # even though the hash still matches.
      - name: last_known_paths
        type: string
        is_list: true
      # Whether to run retention pruning in this same operation, off the UI thread.
      - name: prune
        type: boolean
      # Flat retention fields (no data-carrying enum DTOs are supported) mirroring
      # skrib_format::retention::RetentionPolicy / the UI's BackupPolicy.
      - name: retention_mode
        type: enum
        enum_name: RetentionMode
        enum_values:
        - Tiered
        - KeepLastN
      - name: keep_last_n
        type: uinteger
      - name: gfs_hourly
        type: uinteger
      - name: gfs_daily
        type: uinteger
      - name: gfs_weekly
        type: uinteger
      - name: gfs_monthly
        type: uinteger
      # Absolute floor: the newest `min_keep` backups per destination are never pruned.
      - name: min_keep
        type: uinteger
    dto_out:
      name: BackupResultDto
      fields:
      # The fresh content fingerprint of what was gathered (for skip-if-unchanged).
      - name: content_hash
        type: string
      # Full output paths actually written AND verified.
      - name: succeeded_paths
        type: string
        is_list: true
      # Destinations skipped because their content matched the last-known hash
      # AND the previously-written file still exists on disk.
      - name: skipped_directories
        type: string
        is_list: true
      # Destinations whose write (or post-write verification) failed (parallel to
      # `failed_reasons`).
      - name: failed_directories
        type: string
        is_list: true
      - name: failed_reasons
        type: string
        is_list: true
      # Backup files pruned by retention this run (parallel semantics to
      # `delete_errors`, which records the ones that failed to delete).
      - name: deleted_paths
        type: string
        is_list: true
      - name: delete_errors
        type: string
        is_list: true
  - name: close_work
    entities:
    - Work
    - Binder
    - BinderItem
    - BinderTag
    - Content
    - DictWord
    - TrashInfo
    - WorkInfo
    - Search
    - SearchResult
    undoable: false
  - name: new_work
    entities:
    - Root
    - System
    - WorkInfo
    - Search
    - RecentWork
    - Work
    - Binder
    - BinderItem
    - Content
    undoable: false
    dto_in:
      name: NewWorkDto
      fields:
      - name: file_name
        type: string
      - name: is_folder
        type: boolean
      - name: template_kind
        type: enum
        enum_name: NewWorkTemplate
        enum_values:
        - None
        - EmptyNovel
        - LightNovel
        - Novel
        - NoteBook
      - name: labels
        type: string
        is_list: true
      - name: language
        type: string
      - name: chapter_scene_mode
        type: boolean
- name: export_management
  use_cases:
  - name: export_work
    entities:
    - Work
    - Binder
    - BinderItem
    - BinderTag
    - Content
    undoable: false
    read_only: true
    long_operation: true
    dto_in:
      name: ExportWorkDto
      fields:
      - name: work_id
        type: integer
      - name: output_path
        type: string
      - name: format
        type: enum
        enum_name: ExportFormat
        enum_values:
        - Djot
        - PlainText
        - Markdown
        - Html
        - Latex
        - Docx
        - Epub
        - Pdf
      - name: scope_kind
        type: enum
        enum_name: ExportScopeKind
        enum_values:
        - CurrentBook
        - CurrentPart
        - CurrentChapter
        - CurrentScene
        - CurrentNote
        - CurrentFolder
        - Custom
      - name: preset_json
        type: string
      - name: binder_item_ids
        type: integer
        is_list: true
    dto_out:
      name: ExportResultDto
      fields:
      - name: exported_count
        type: integer
      - name: output_path
        type: string
- name: trash_management
  use_cases:
  - name: trash_binder_items
    entities:
    - Work
    - TrashInfo
    - BinderItem
    - Content
    undoable: true
    dto_in:
      name: TrashBinderItemsDto
      fields:
      - name: binder_item_ids
        type: integer
        is_list: true
      - name: origin_binder_id
        type: integer
  - name: trash_binder
    entities:
    - Work
    - TrashInfo
    - Binder
    - BinderItem
    - Content
    undoable: true
    dto_in:
      name: TrashBinderDto
      fields:
      - name: binder_id
        type: integer
  - name: restore_items
    entities:
    - Work
    - TrashInfo
    - Binder
    - BinderItem
    - Content
    undoable: true
    dto_in:
      name: RestoreItemsDto
      fields:
      - name: trash_info_ids
        type: integer
        is_list: true
    dto_out:
      name: RestoreResultDto
      fields:
      - name: restored_count
        type: integer
      - name: orphaned
        type: boolean
  - name: empty_trash
    entities:
    - Work
    - TrashInfo
    - Binder
    - BinderItem
    - Content
    undoable: true
- name: binder_item_management
  use_cases:
  - name: duplicate
    entities:
    - Binder
    - BinderItem
    - Content
    undoable: true
    dto_in:
      name: DuplicateDto
      fields:
      - name: item_ids
        type: uinteger
        is_list: true
    dto_out:
      name: DuplicateReturnDto
      fields:
      - name: new_item_ids
        type: uinteger
        is_list: true
  - name: move_items
    entities:
    - Binder
    - BinderItem
    undoable: true
    dto_in:
      name: MoveDto
      fields:
      - name: item_ids
        type: uinteger
        is_list: true
      - name: target_id
        type: uinteger
        optional: true
      - name: target_is_binder
        type: boolean
      - name: move_place
        type: enum
        enum_name: MovePlace
        enum_values:
        - Before
        - After
        - Into
  - name: merge_two_scenes
    entities:
    - Work
    - TrashInfo
    - Binder
    - BinderItem
    - Content
    undoable: true
    dto_in:
      name: MergeTwoScenesDto
      fields:
      - name: target_id
        type: uinteger
      - name: source_id
        type: uinteger
  - name: split_scene
    entities:
    - Binder
    - BinderItem
    - Content
    undoable: true
    dto_in:
      name: SplitSceneDto
      fields:
      - name: source_id
        type: uinteger
      - name: before_text
        type: string
      - name: after_text
        type: string
      - name: before_synopsis
        type: string
      - name: after_synopsis
        type: string
      - name: new_title
        type: string
  - name: promote
    entities:
    - BinderItem
    - Content
    undoable: true
    dto_in:
      name: PromoteDto
      fields:
      - name: item_id
        type: uinteger
      # A `skribisto_model::PromoteTarget` wire code. Not a list index: the use case
      # re-derives the legal targets from the item's *current* type and rejects a code
      # that isn't among them, so a stale menu can never promote to the wrong type.
      - name: target
        type: uinteger
- name: handling_app_lifecycle
  use_cases:
  - name: initialize_app
    entities:
    - Root
    - System
    undoable: false
    dto_out:
      name: InitializeAppResultDto
      fields:
      - name: root_id
        type: uinteger
  - name: clean_up_before_exit
    entities:
    - Root
    - System
    undoable: false
- name: import_management
  use_cases:
  - name: import_plume_creator_file
    entities: []
    undoable: false
    read_only: true
    long_operation: true
    dto_in:
      name: ImportPlumeCreatorFileDto
      fields:
      - name: source_path
        type: string
      - name: output_path
        type: string
      - name: overwrite
        type: boolean
      - name: manuscript_binder_name
        type: string
      - name: story_bible_binder_name
        type: string
    dto_out:
      name: ImportPlumeCreatorFileResultDto
      fields:
      - name: output_path
        type: string
      - name: imported_items
        type: integer
      - name: skipped_trashed
        type: integer
      - name: warnings
        type: string
        is_list: true
- name: search_management
  use_cases:
  # Synchronous Command UoW. NOT `read_only` — a QueryUnitOfWork has no commit(), so
  # a read-only use case structurally cannot write the SearchResult rows. NOT a
  # long_operation either: being synchronous is what removes the need for cancellation
  # and a generation counter, since there is no thread boundary for two searches to
  # race across (the UI debounce already serialises them).
  - name: run_search
    entities:
    - Work
    - WorkInfo
    - Search
    - SearchResult
    - Binder
    - BinderItem
    - Content
    undoable: false
    dto_in:
      name: RunSearchDto
      fields:
      - name: query
        type: string
      - name: case_sensitive
        type: boolean
      - name: whole_word
        type: boolean
      - name: diacritic_sensitive
        type: boolean
      # SearchFacet codes; empty = every kind. See the Search entity.
      - name: facets
        type: integer
        is_list: true
      - name: search_body
        type: boolean
      - name: search_titles
        type: boolean
      - name: search_synopsis
        type: boolean
      - name: search_labels
        type: boolean
      - name: include_trashed
        type: boolean
    dto_out:
      name: RunSearchResultDto
      fields:
      - name: match_count
        type: uinteger
      - name: item_count
        type: uinteger
      - name: truncated
        type: boolean
  # SYNCHRONOUS, deliberately — and this is not the obvious choice, so: Qleany
  # silently IGNORES `undoable: true` when `long_operation: true`. Compare the two
  # generated controllers: an undoable command's controller takes an
  # `undo_redo_manager` and calls `add_command_to_stack(uc, stack_id)`; a long
  # operation's takes a `long_operation_manager`, calls `start_operation(uc)` — which
  # *consumes* the use case — and never touches the undo stack. The manifest validates
  # and the code compiles; the replace would simply never be undoable.
  #
  # Undo is the whole safety story for a bulk replace (one Ctrl-Z / one toast action
  # puts the manuscript back), so it wins over progress-and-cancel. `snapshot_work` /
  # `restore_work` is O(1) — an `im::HashMap` structural clone — so the batch is one
  # undo entry regardless of how many scenes it touched.
  - name: replace_in_project
    entities:
    - Work
    - WorkInfo
    - Search
    - SearchResult
    - Binder
    - BinderItem
    - Content
    undoable: true
    dto_in:
      name: ReplaceInProjectDto
      fields:
      - name: replacement
        type: string
      - name: preserve_case
        type: boolean
      # SearchResult ids the writer unticked — the fields to leave alone.
      - name: excluded_result_ids
        type: uinteger
        is_list: true
    dto_out:
      name: ReplaceInProjectResultDto
      fields:
      - name: items_changed
        type: uinteger
      - name: occurrences_replaced
        type: uinteger
      # Fields whose occurrence count no longer matches what the writer reviewed:
      # skipped and reported, never guessed at.
      - name: skipped_stale
        type: uinteger
        is_list: true
ui:
  rust_cli: false
