name: Generate releases in metainfo from NEWS.yml

# Keeps the AppStream <releases> block in eu.skribisto.skribisto.metainfo.xml in
# sync with NEWS.yml. Runs when NEWS.yml changes on the active branch; commits
# the regenerated metainfo back if it changed.

on:
  push:
    branches: [master, bastyde-migration]
    paths:
      - "NEWS.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: NEWS.yml -> metainfo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install AppStream
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream

      - name: Regenerate metainfo releases from NEWS.yml
        run: |
          appstreamcli news-to-metainfo --limit=1 ./NEWS.yml ./eu.skribisto.skribisto.metainfo.xml

      - name: Commit if changed
        run: |
          if git diff --quiet -- eu.skribisto.skribisto.metainfo.xml; then
            echo "metainfo already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eu.skribisto.skribisto.metainfo.xml
          git commit -m "chore(metainfo): regenerate releases from NEWS.yml"
          git push
