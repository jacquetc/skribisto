name: Release

# Cuts a GitHub Release on a version tag and attaches, for four platforms'
# worth of one application: the Linux Flatpak bundle, a standalone Linux tarball,
# the macOS universal .dmg, and the Windows installer + portable zip.
#
# The .dmg is UNSIGNED until an Apple Developer Program enrolment exists, so its
# users need one documented extra step (System Settings -> Privacy & Security ->
# "Open Anyway"). That belongs in the release notes, not in a surprise.
#
# The release version is a GIT fact (the tag), not a Cargo one: every crate
# shares the placeholder version = "3.0.0", and build.rs stamps the tag into the
# binary via SKRIBISTO_GIT_DESCRIBE. So there is no "Cargo version matches tag"
# gate — the tag IS the version.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*" # pre-releases: v3.0.0-beta.1

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Prove the tag builds and tests before producing any artifact.
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-linux-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/strip-path-deps
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux
      - name: Test
        run: cargo test --workspace

      # The release notes a Linux software centre shows come from the AppStream
      # metainfo, NOT from the GitHub Release. That file is regenerated from
      # NEWS.yml by generate-release-in-appdata.yml, which triggers on a push to
      # master and commits the result BACK to master — so a tag cut at or before
      # that commit cannot contain it, and the artifact ships the previous
      # release's notes. v3.0.1 shipped exactly that way: the tag was v3.0.1
      # while the metainfo still said 3.0.0, so every GNOME Software and KDE
      # Discover user was shown 3.0.0's "what's new" for a 3.0.1 install.
      #
      # This is the gate that ordering problem needs. It is deliberately in
      # `validate`, before a single artifact is built: a stale metainfo cannot be
      # repaired after the fact, because Flathub builds from the tag.
      #
      # To fix a failure: add the version's block to NEWS.yml, run
      #   appstreamcli news-to-metainfo --limit=1 ./NEWS.yml ./eu.skribisto.skribisto.metainfo.xml
      # commit both, then move the tag.
      - name: The tag's release notes are in NEWS.yml and in the metainfo
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream
          VERSION="${GITHUB_REF_NAME#v}"

          if ! grep -qE "^Version: *\"?${VERSION}\"?[[:space:]]*$" NEWS.yml; then
            echo "::error::NEWS.yml has no block for ${VERSION}. The GitHub Release would fall back to a bare \"Release ${GITHUB_REF_NAME}.\" and the software centres would show the previous release's notes."
            exit 1
          fi

          # `news-to-metainfo` rewrites in place, so work on a copy and diff.
          cp eu.skribisto.skribisto.metainfo.xml /tmp/committed.xml
          cp eu.skribisto.skribisto.metainfo.xml /tmp/regenerated.xml
          appstreamcli news-to-metainfo --limit=1 ./NEWS.yml /tmp/regenerated.xml
          if ! diff -u /tmp/committed.xml /tmp/regenerated.xml; then
            echo "::error::eu.skribisto.skribisto.metainfo.xml is not what NEWS.yml regenerates to. Commit the regenerated file, then move the tag."
            exit 1
          fi

          NEWEST=$(sed -n 's/.*<release[^>]*version="\([^"]*\)".*/\1/p' eu.skribisto.skribisto.metainfo.xml | head -1)
          if [ "$NEWEST" != "$VERSION" ]; then
            echo "::error::the metainfo's newest release is ${NEWEST}, but this tag is ${VERSION}."
            exit 1
          fi
          echo "NEWS.yml and the metainfo both name ${VERSION}."

  # -------- Linux: single .flatpak bundle --------
  flatpak:
    name: Flatpak bundle
    needs: validate
    # The build itself lives in flatpak.yml, which a weekly schedule also runs.
    # One definition, so the scheduled canary and the release build cannot differ.
    uses: ./.github/workflows/flatpak.yml

  # -------- Linux: standalone tarball --------
  #
  # The Flatpak is not a standalone binary: installing it needs flatpak itself
  # plus a freedesktop runtime pulled from Flathub. This is the "download it and
  # run it" option, and until it existed there was no such thing for Linux.
  #
  # Built on ubuntu-latest, so it needs that image's glibc or newer. It does not
  # pretend to be portable to every distribution; a musl or oldest-glibc build is
  # a separate exercise with its own trade-offs.
  linux:
    name: Linux tarball
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SKRIBISTO_GIT_DESCRIBE: ${{ github.ref_name }}
      # Nothing updates a tarball, so the application is the only signal this
      # reader will ever get that a newer release exists. See
      # crates/teksilo_ui/src/updates/channel.rs.
      SKRIBISTO_CHANNEL: tarball
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-linux-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/strip-path-deps
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux

      - name: Build release binary (pdf)
        run: cargo build --release -p teksilo_ui --features pdf

      # The icons are installed under the names the .desktop and the MIME entry
      # actually ask for (Icon=eu.skribisto.skribisto, <icon
      # name="eu.skribisto.skribisto.project"/>), NOT under their source name
      # `skribisto.png`. The Flatpak renames them for the same reason. An icon
      # filed under a name nothing looks up is invisible, and silently so.
      - name: Stage the tarball
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          root="Skribisto-${version}-x86_64-linux"
          stage="dist/$root"

          install -Dm755 target/release/skribisto "$stage/skribisto"
          install -Dm644 COPYING                  "$stage/COPYING"
          install -Dm644 README.md                "$stage/README.md"

          install -Dm644 resources/unix/applications/eu.skribisto.skribisto.desktop \
            "$stage/share/applications/eu.skribisto.skribisto.desktop"
          install -Dm644 resources/unix/mime/eu.skribisto.skribisto.xml \
            "$stage/share/mime/packages/eu.skribisto.skribisto.xml"
          install -Dm644 resources/unix/icons/icons/hicolor/scalable/apps/skribisto.svg \
            "$stage/share/icons/hicolor/scalable/apps/eu.skribisto.skribisto.svg"
          install -Dm644 resources/unix/icons/icons/hicolor/scalable/apps/skribisto.svg \
            "$stage/share/icons/hicolor/scalable/mimetypes/eu.skribisto.skribisto.project.svg"
          for size in 16 32 64 72 96 192 256 512; do
            src="resources/unix/icons/icons/hicolor/${size}x${size}/apps/skribisto.png"
            if [ -f "$src" ]; then
              install -Dm644 "$src" "$stage/share/icons/hicolor/${size}x${size}/apps/eu.skribisto.skribisto.png"
              install -Dm644 "$src" "$stage/share/icons/hicolor/${size}x${size}/mimetypes/eu.skribisto.skribisto.project.png"
            fi
          done

          # Exec=skribisto expects the binary on PATH, so a bare `cp share/` is
          # not enough on its own. Ten lines that do the whole user-local install
          # beat a paragraph telling someone to do it by hand.
          cat > "$stage/install.sh" <<'SH'
          #!/bin/sh
          # Install Skribisto for the current user (default prefix ~/.local).
          # Usage: ./install.sh [prefix]
          set -eu
          prefix="${1:-$HOME/.local}"
          here="$(cd "$(dirname "$0")" && pwd)"
          install -Dm755 "$here/skribisto" "$prefix/bin/skribisto"
          mkdir -p "$prefix/share"
          cp -r "$here/share/." "$prefix/share/"
          update-desktop-database "$prefix/share/applications" 2>/dev/null || true
          update-mime-database "$prefix/share/mime" 2>/dev/null || true
          gtk-update-icon-cache -f -t "$prefix/share/icons/hicolor" 2>/dev/null || true
          printf 'Installed to %s\n' "$prefix"
          case ":$PATH:" in
            *":$prefix/bin:"*) ;;
            *) printf 'Note: %s/bin is not on your PATH.\n' "$prefix" ;;
          esac
          SH
          sed -i 's/^          //' "$stage/install.sh"
          chmod 755 "$stage/install.sh"

          tar -C dist -czf "dist/${root}.tar.gz" "$root"
          ls -la "dist/${root}.tar.gz"

      - name: Upload Linux tarball
        uses: actions/upload-artifact@v7
        with:
          name: skribisto-linux
          path: dist/*.tar.gz
          if-no-files-found: error

  # -------- macOS: universal .dmg (unsigned until enrolled) --------
  macos:
    name: macOS package
    needs: validate
    # Same reasoning as the Flatpak job: one definition, called from here rather
    # than duplicated. release-macos.yml stays dispatchable on its own.
    uses: ./.github/workflows/release-macos.yml
    # A called workflow receives NO secrets unless they are passed. Without this
    # line release-macos.yml reads `secrets.MACOS_CERTIFICATE` as empty however
    # it is set, so `Determine signing mode` would report "disabled" forever and
    # quietly ship unsigned .dmg files after an Apple enrolment. It is a no-op
    # today, which is exactly why it would not be noticed later.
    #
    # `inherit` covers repository and organisation secrets. It does NOT reach
    # ENVIRONMENT secrets: if the Apple ones go in the `release` environment
    # alongside FLATHUB_FORK_TOKEN, release-macos.yml's own job must declare
    # `environment: release` as well.
    secrets: inherit

  # -------- Windows: installer + portable zip --------
  #
  # Built natively on windows-latest. package/windows/build.py can produce the
  # same artifacts by cross-compiling from Linux, but the release deliberately
  # does not: a native build keeps a real Windows machine in the release path.
  windows:
    name: Windows package
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Stamp the release version into the binary (build.rs reads this).
      SKRIBISTO_GIT_DESCRIBE: ${{ github.ref_name }}
      # One value for the installer and the portable zip alike: this job runs one
      # `cargo build` and packages its output twice, so the two artifacts cannot
      # carry different stamps. Neither self-updates, so neither needs to.
      SKRIBISTO_CHANNEL: windows
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: ./.github/actions/strip-path-deps

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows

      # Statically link the CRT so the exe needs no Visual C++ redistributable.
      # `+crt-static` takes the UCRT with it as well: a static build imports
      # neither vcruntime140.dll nor any api-ms-win-crt-*.dll.
      - name: Configure static CRT
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .cargo | Out-Null
          @"
          [target.'cfg(all(windows, target_env = "msvc"))']
          rustflags = ["-C", "target-feature=+crt-static"]
          "@ | Set-Content -Path .cargo/config.toml -Encoding utf8

      - name: Build release exe (pdf)
        run: cargo build --release --target x86_64-pc-windows-msvc -p teksilo_ui --features pdf

      - name: Compute version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stage portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/skribisto.exe dist/
          Compress-Archive -Path dist/skribisto.exe -DestinationPath dist/Skribisto-portable.zip -Force

      # NSIS is NOT preinstalled any more, and the comment that used to sit here
      # saying it was is why this broke without anyone touching it. `windows-latest`
      # migrated to Windows Server 2025: the 2022 image manifest lists "NSIS 3.10",
      # the 2025 one lists none at all (it ships Chocolatey, InnoSetup and WiX
      # instead). The failure is `The term 'makensis' is not recognized`.
      #
      # Installing it explicitly rather than pinning windows-2022 keeps the job
      # independent of what an image happens to bundle, which is the same lesson
      # librsvg2-common taught the Flatpak job.
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          # Chocolatey does not shim the executables of an installer-based package,
          # so the install directory goes on PATH explicitly rather than on trust.
          $candidates = @("$env:ProgramFiles\NSIS", "${env:ProgramFiles(x86)}\NSIS")
          $makensis = Get-ChildItem -Path $candidates -Filter makensis.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $makensis) { throw "makensis.exe not found after installing NSIS" }
          Add-Content -Path $env:GITHUB_PATH -Value $makensis.DirectoryName
          & $makensis.FullName /VERSION

      - name: Compile installer
        shell: pwsh
        run: |
          # makensis resolves relative paths against the script's own
          # directory, not the working directory, so both of these must be
          # absolute.
          $src = Join-Path $pwd 'target\x86_64-pc-windows-msvc\release\skribisto.exe'
          $out = Join-Path $pwd 'dist\Skribisto-setup.exe'
          makensis /V3 `
            "/DAPP_VERSION=${{ steps.ver.outputs.version }}" `
            "/DSRC_EXE=$src" `
            "/DOUT_FILE=$out" `
            package\windows\setup.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with $LASTEXITCODE" }

      # ---- Optional Authenticode signing via SignPath (no-op until enrolled) ----
      - name: Determine signing mode
        id: sign
        shell: bash
        env:
          HAS_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if [ -n "$HAS_TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi

      # Distinct FILENAMES, not just a distinct artifact name. The release job
      # downloads every artifact of the run and copies them into one flat
      # directory, so two files both called Skribisto-setup.exe resolve by `find`
      # traversal order. That is a signed release quietly shipping unsigned
      # binaries, with nothing in the log to say so.
      #
      # SignPath's artifact configuration must reference THESE names. That costs
      # nothing today, since signing is not enrolled yet and there is no
      # configuration to migrate.
      - name: Stage unsigned artifacts under distinct names
        if: steps.sign.outputs.enabled == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path unsigned | Out-Null
          Copy-Item dist/Skribisto-portable.zip unsigned/Skribisto-portable-unsigned.zip
          Copy-Item dist/Skribisto-setup.exe    unsigned/Skribisto-setup-unsigned.exe

      - name: Upload unsigned artifacts (for SignPath)
        if: steps.sign.outputs.enabled == 'true'
        id: unsigned
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned
          path: unsigned/
          if-no-files-found: error

      - name: Submit signing request
        if: steps.sign.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: skribisto
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      # The signed files come back under the names they were submitted with. The
      # release ships the canonical names, so put them back before the upload.
      - name: Adopt the signed binaries under their release names
        if: steps.sign.outputs.enabled == 'true'
        shell: pwsh
        run: |
          Copy-Item signed/Skribisto-portable-unsigned.zip dist/Skribisto-portable.zip -Force
          Copy-Item signed/Skribisto-setup-unsigned.exe    dist/Skribisto-setup.exe -Force
      # ---- end optional signing ----

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: skribisto-windows
          path: |
            dist/Skribisto-portable.zip
            dist/Skribisto-setup.exe
          if-no-files-found: error

  # -------- Assemble the GitHub Release --------
  release:
    name: Create Release
    needs: [flatpak, linux, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Collected by ARTIFACT NAME, not by a filename glob over everything that
      # was downloaded. The glob could not tell a shipping file from a staging
      # one: `windows-unsigned` holds the same binaries before signing, and a
      # `*.zip` pattern swept it in regardless. Naming the four artifacts that
      # ship makes "what goes in the release" a decision rather than a side
      # effect of a pattern.
      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p release
          for artifact in skribisto-flatpak skribisto-linux skribisto-macos-universal skribisto-windows; do
            if [ ! -d "artifacts/$artifact" ]; then
              echo "::error::expected artifact '$artifact' is missing from this run"
              exit 1
            fi
            find "artifacts/$artifact" -type f -exec cp {} release/ \;
          done
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract release notes from NEWS.yml
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Pull the Description bullets of the NEWS.yml block for this version.
          awk -v ver="$VERSION" '
            /^Version:/  { cur=$2; gsub(/[" ]/,"",cur) }
            /^Description:/ { indesc=(cur==ver); next }
            /^---/       { indesc=0 }
            indesc && /^- / { line=$0; sub(/^- +/,"- ",line); gsub(/^- +"?|"$/,"",line); print "- " line }
          ' NEWS.yml > release_notes.md || true
          if [ ! -s release_notes.md ]; then
            echo "Release ${GITHUB_REF_NAME}." > release_notes.md
          fi
          echo "----- notes -----"; cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release/*
          fail_on_unmatched_files: true

      # The website rebuilds data/release.toml (the download page's versions,
      # sizes and checksums) and static/updates/stable.json (what the running
      # application reads to learn a newer version exists) from the published
      # releases. Its own workflow documents this exact step and it was never
      # added, so both files only ever caught up on the next 06:17 cron: the
      # download page advertised the previous release for up to a day after this
      # one went out, and so did the in-app notice.
      #
      # Deliberately not `fail`-ing on a missing token. The daily cron is the
      # backstop, so the cost of a missing secret is lateness, not wrong data,
      # and a release that has already published its artifacts must not be marked
      # failed over a website refresh.
      - name: Tell the website to resync
        env:
          WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${WEBSITE_DISPATCH_TOKEN}" ]; then
            echo "::warning::WEBSITE_DISPATCH_TOKEN is not set; skribisto.eu will catch up on its next daily sync instead of now."
            exit 0
          fi
          if curl -sSf -X POST \
            -H "Authorization: Bearer ${WEBSITE_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/FernTech-EU/skribisto-website/dispatches \
            -d '{"event_type":"release-published"}'; then
            echo "website resync requested."
          else
            echo "::warning::website resync dispatch was refused; skribisto.eu will catch up on its next daily sync instead of now."
          fi

  # -------- Flathub: open the update PR --------
  #
  # Flathub's bot cannot do this alone. flatpak-external-data-checker reads the
  # x-checker-data in the Flathub manifest and bumps `tag` and `commit`, but it
  # cannot regenerate cargo-sources.json, and a tag bumped without it fails the
  # offline build with a missing-package error. That gap is
  # flatpak-external-data-checker#252, open and unassigned since 2021.
  #
  # So the update is pushed from here, where the vendored set was already
  # generated from the lockfile OF THIS TAG by the flatpak job. Both halves leave
  # one run and cannot disagree, which is the entire reason this job exists rather
  # than a second generation on the Flathub side.
  #
  # It goes through the FORK, never straight at flathub/. That is the ordinary
  # Flathub contribution route, it needs no credential on someone else's
  # repository, and it keeps a human approval between a tag and the store.
  flathub:
    name: Flathub update PR
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Flathub stable takes final releases only. A pre-release tag carries a
    # hyphen, the same test the Release itself uses to set `prerelease:`.
    if: ${{ !contains(github.ref_name, '-') }}
    # FLATHUB_FORK_TOKEN is an ENVIRONMENT secret, not a repository one, so this
    # job has to name the environment to see it. Without this line
    # `secrets.FLATHUB_FORK_TOKEN` resolves to the empty string and the job
    # reports "no token configured" and skips, which is the one failure mode that
    # looks like everything is fine.
    #
    # If the environment carries protection rules, they apply here: required
    # reviewers pause this job until someone approves, and a deployment branch or
    # tag rule must allow the version tags or the job never starts.
    environment: release
    env:
      FORK: jacquetc/eu.skribisto.skribisto
      UPSTREAM: flathub/eu.skribisto.skribisto
    steps:
      # A missing credential is not an emergency and must not fail a tag that has
      # already produced every artifact. It reports why and stops.
      #
      # FLATHUB_FORK_TOKEN needs rights on the FORK only. Make it a CLASSIC PAT
      # with `public_repo`: a fine-grained token is scoped to repositories you
      # own, and opening a pull request against flathub/ is not something it can
      # express. A classic token acts as you, and anyone may open a PR on a
      # public repository.
      - name: Determine whether a fork token is configured
        id: creds
        env:
          HAS_TOKEN: ${{ secrets.FLATHUB_FORK_TOKEN }}
        run: |
          if [ -n "$HAS_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FLATHUB_FORK_TOKEN is not set, so no Flathub PR was opened for ${GITHUB_REF_NAME}. Update ${UPSTREAM} by hand, or add a classic PAT with public_repo scope."
          fi

      - name: Check out the Flathub fork
        if: steps.creds.outputs.enabled == 'true'
        uses: actions/checkout@v6
        with:
          repository: jacquetc/eu.skribisto.skribisto
          token: ${{ secrets.FLATHUB_FORK_TOKEN }}
          path: flathub
          # Needed to branch off upstream/master below rather than off whatever
          # the fork happens to hold.
          fetch-depth: 0

      - name: Download the vendored cargo sources
        if: steps.creds.outputs.enabled == 'true'
        uses: actions/download-artifact@v8
        with:
          name: cargo-sources
          path: cargo-sources

      # The branch starts at UPSTREAM's master, not at the fork's. A fork drifts
      # behind the moment anyone else touches the Flathub repo, and a branch cut
      # from a stale fork produces a pull request that reverts their commits
      # while appearing to be a one-line version bump.
      - name: Branch from the upstream manifest
        if: steps.creds.outputs.enabled == 'true'
        working-directory: flathub
        run: |
          set -euo pipefail
          # Idempotent for the same reason `switch -C` is below: a fresh CI
          # checkout never has this remote, which is exactly the sort of
          # assumption that holds until someone re-runs the step.
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch --quiet upstream master
          git switch -C "update-${GITHUB_REF_NAME}" upstream/master
          echo "branched from upstream/master at $(git rev-parse --short upstream/master)"

      - name: Point the Flathub manifest at this tag
        if: steps.creds.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          manifest=flathub/eu.skribisto.skribisto.yml

          # The base is UPSTREAM's master, and upstream can hold an older
          # GENERATION of this application rather than merely an older version of
          # it. It did: the C++/Qt6 manifest stayed on Flathub after the Rust
          # rewrite shipped, so bumping `tag` and `commit` on top of it produced a
          # manifest that handed a Cargo workspace to cmake-ninja and failed with
          # "Can't find CMakeLists.txt". Nothing else in this job can notice, and
          # the result reads as an ordinary version bump, so check the base is the
          # manifest this release can actually be built by. A vendored crate set
          # means nothing to a manifest that never invokes cargo.
          grep -q 'buildsystem: simple' "$manifest" \
            || { echo "::error::${UPSTREAM}'s master still carries a non-Rust manifest (no 'buildsystem: simple' in eu.skribisto.skribisto.yml). Land the manifest migration there before a tag can update it."; exit 1; }
          grep -q 'cargo --offline build' "$manifest" \
            || { echo "::error::${UPSTREAM}'s master has no offline cargo build command in eu.skribisto.skribisto.yml. Land the manifest migration there before a tag can update it."; exit 1; }
          # Not fatal, and deliberately so. Without the stamp the Flathub build
          # parses as `source`, which never checks on its own — so a missing
          # value costs the reader nothing, while a wrong one (`flatpak-bundle`)
          # would have every Flathub install duplicating what the software centre
          # already tells them. Warn, and let the release through.
          grep -q 'SKRIBISTO_CHANNEL: flathub' "$manifest" \
            || echo "::warning::${UPSTREAM}'s manifest does not set SKRIBISTO_CHANNEL: flathub. The store build will not identify its channel, so it stays silent about updates (safe, but it also will not say that Flathub keeps it current)."

          # The indent is captured and replayed so only the git source's own keys
          # move, and the surrounding comments stay exactly as written. The commit
          # is quoted because an unquoted 40-digit hash is a YAML integer.
          sed -i -E "s|^( *)tag: .*$|\1tag: ${GITHUB_REF_NAME}|" "$manifest"
          sed -i -E "s|^( *)commit: .*$|\1commit: \"${GITHUB_SHA}\"|" "$manifest"

          # A sed that matches nothing says nothing. Unchecked, that is a PR which
          # bumps the vendored crates while still naming the previous tag: the one
          # combination that builds cleanly and ships the wrong source.
          grep -q "tag: ${GITHUB_REF_NAME}$" "$manifest" \
            || { echo "::error::tag was not written into $manifest"; exit 1; }
          grep -q "commit: \"${GITHUB_SHA}\"$" "$manifest" \
            || { echo "::error::commit was not written into $manifest"; exit 1; }

          cp cargo-sources/cargo-sources.json flathub/cargo-sources.json
          git -C flathub --no-pager diff --stat

      - name: Push the branch and open the pull request
        if: steps.creds.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.FLATHUB_FORK_TOKEN }}
        working-directory: flathub
        run: |
          set -euo pipefail
          branch="update-${GITHUB_REF_NAME}"
          owner="${FORK%%/*}"

          if git diff --quiet; then
            echo "::notice::${UPSTREAM} already matches ${GITHUB_REF_NAME}; nothing to open"
            exit 0
          fi

          git config user.name "Skribisto release"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add eu.skribisto.skribisto.yml cargo-sources.json
          git commit -m "Update to ${GITHUB_REF_NAME}"
          # origin is the fork. Re-running a tag replaces its own branch there.
          git push --force-with-lease origin "$branch"

          # Matched on owner AND branch: `--head` alone cannot tell this fork's
          # branch from an identically named one on another contributor's.
          existing=$(gh pr list --repo "$UPSTREAM" --state open \
            --json number,headRefName,headRepositoryOwner \
            --jq ".[] | select(.headRefName==\"$branch\" and .headRepositoryOwner.login==\"$owner\") | .number")

          if [ -n "$existing" ]; then
            echo "::notice::PR #${existing} on ${UPSTREAM} is already open for ${branch}; the update was pushed to it"
            exit 0
          fi

          body=$(printf '%s\n' \
            "Automated from jacquetc/skribisto ${GITHUB_REF_NAME} (${GITHUB_SHA})." \
            "" \
            "The manifest tag/commit and \`cargo-sources.json\` come from the same release" \
            "run, generated from the lockfile of this tag, so the vendored crate set matches" \
            "the source being built. Keeping them together is what the external data checker" \
            "cannot do on its own: flathub-infra/flatpak-external-data-checker#252.")

          gh pr create --repo "$UPSTREAM" --base master --head "${owner}:${branch}" \
            --title "Update to ${GITHUB_REF_NAME}" --body "$body"
