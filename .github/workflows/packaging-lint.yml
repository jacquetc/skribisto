name: Packaging manifests

# Cheap PR guard: validate the packaging metadata when it changes, so a broken
# .desktop / metainfo / Flatpak manifest is caught in seconds without running a
# full packaging build (which only runs on tags, in release.yml).

on:
  pull_request:
    paths:
      - "eu.skribisto.skribisto.metainfo.xml"
      - "resources/unix/applications/*.desktop"
      - "resources/unix/mime/*.xml"
      - "package/flatpak/**"
  push:
    branches: [master]
    paths:
      - "eu.skribisto.skribisto.metainfo.xml"
      - "resources/unix/applications/*.desktop"
      - "resources/unix/mime/*.xml"
      - "package/flatpak/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate desktop + metainfo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install validators
        run: |
          sudo apt-get update
          # shared-mime-info provides `update-mime-database`, which is the only
          # thing that actually validates the MIME XML against its schema.
          sudo apt-get install -y appstream desktop-file-utils shared-mime-info

      - name: Validate .desktop entry
        run: desktop-file-validate resources/unix/applications/eu.skribisto.skribisto.desktop

      # `update-mime-database` is the only thing that actually parses the MIME
      # XML against the shared-mime-info schema; a typo there is otherwise
      # invisible until a user's file manager silently ignores the type.
      - name: Validate MIME package
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          install -Dm644 resources/unix/mime/eu.skribisto.skribisto.xml \
            "$tmp/packages/eu.skribisto.skribisto.xml"
          update-mime-database "$tmp"

      # The bug this exists to prevent: the .desktop advertised a MIME type no
      # installed XML defined, and the Flatpak — the only shipped Linux artifact
      # — never installed the MIME package at all, so `.skrib` was associated
      # with nothing. Neither desktop-file-validate nor appstreamcli notices,
      # because each only ever sees one file.
      - name: Every advertised MIME type is defined and installed
        run: |
          set -euo pipefail
          desktop=resources/unix/applications/eu.skribisto.skribisto.desktop
          mime_xml=resources/unix/mime/eu.skribisto.skribisto.xml
          flatpak=package/flatpak/eu.skribisto.skribisto.yml

          grep -q "share/mime/packages" "$flatpak" || {
            echo "::error file=$flatpak::the Flatpak never installs $mime_xml, so the .desktop MimeType= associates with nothing"
            exit 1
          }

          status=0
          types=$(sed -n 's/^MimeType=//p' "$desktop" | tr ';' '\n' | grep -v '^$')
          for t in $types; do
            if ! grep -qF "\"$t\"" "$mime_xml"; then
              echo "::error file=$desktop::MimeType=$t is not defined (as a <mime-type> or <alias>) in $mime_xml"
              status=1
            fi
          done
          exit $status

      # The bug this exists to prevent: `flatpak build-finish` silently refuses to
      # export any file whose basename does not start with the app id. It prints
      # "non-allowed export filename" and carries on, so the build stays green
      # while the icon never reaches the host. That is what happened to the nine
      # .skrib document icons: the MIME package exported, the type association
      # worked, and every project file rendered as a generic archive because the
      # icon the type names did not exist. The second half checks the two files
      # still agree on the name, since fixing one without the other is silent too.
      - name: Every exported icon is app-id-prefixed, and the MIME entry names it
        run: |
          set -euo pipefail
          flatpak=package/flatpak/eu.skribisto.skribisto.yml
          mime_xml=resources/unix/mime/eu.skribisto.skribisto.xml
          app_id=$(sed -n 's/^app-id: *//p' "$flatpak")

          status=0
          for target in $(grep -oE '/app/share/icons/[^" ]+' "$flatpak" | sort -u); do
            base=$(basename "$target")
            case "$base" in
              "$app_id".*|"$app_id"-*) ;;
              *)
                echo "::error file=$flatpak::$base is installed under share/icons but does not start with $app_id, so flatpak build-finish will refuse to export it"
                status=1
                ;;
            esac
          done

          # The name the manifest installs into mimetypes/ must be the name the
          # MIME entry asks for, or the lookup finds nothing.
          installed=$(grep -oE '/app/share/icons/[^" ]+/mimetypes/[^" ]+' "$flatpak" \
            | xargs -r -n1 basename | sed 's/\.[^.]*$//' | sort -u)
          declared=$(sed -n 's/.*<icon name="\([^"]*\)".*/\1/p' "$mime_xml")
          for name in $installed; do
            if [ "$name" != "$declared" ]; then
              echo "::error file=$mime_xml::the Flatpak installs the document icon as '$name' but <icon name=\"$declared\"/> asks for a different one"
              status=1
            fi
          done
          exit $status

      # A hard check with --strict, no longer informational. The <developer id>
      # that was missing is now there, and this is the gate that should have
      # caught it: Flathub runs `flatpak-builder-lint --exceptions repo` on the
      # finished build and treats appstream-failed-validation as an ERROR, so a
      # metainfo problem does not surface until a 20-minute build on their
      # infrastructure has already run, twice, once per architecture.
      - name: Validate AppStream metainfo
        run: appstreamcli validate --no-net --strict eu.skribisto.skribisto.metainfo.xml
