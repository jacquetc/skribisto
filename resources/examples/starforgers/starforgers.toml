# There is no `[source]` section and no `convert` step: Starforgers arrived as a
# bundle, from its author, and its prose has never passed through this tool. Only
# `enrich` runs, over the same schema the public-domain examples use:
#
#   cargo run -p skribisto-skrib-format --example build_example -- enrich \
#       resources/examples/starforgers/starforgers.toml \
#       resources/examples/starforgers/Starforgers.skrib
#
# ⚠ The cast lists below name only story-bible entries, and the bible is deliberately
# not exhaustive — a note for every walk-on would demonstrate nothing but clutter.
# The reading pass that produced this data also tallied 44 further names that
# have no note, and the JSON predecessor of this file silently dropped every one of
# them when it built the links. Nothing here drops anything silently any more: a name
# with no entry is now a hard error at load. Several of those names recur often enough
# to deserve a note — Sumi-ness (8), Vomisa (5), Saibot (4), Jaye (3), Red Allen (3), Kaigun (2), Mason (2), Kell (2) — and adding one is the way to
# put them back into the cast lists.

[book]
title = "Starforgers"
author = "Ken McConnell"
unique_id = "ne6qxlagXXie"
language = ["en_US"]
timestamp = "2026-08-04T13:37:41.003666551+00:00"
chapter_flat = false
number_chapters = true

# Descriptive only — `enrich` reads the binder names out of the bundle itself. They
# are recorded so this file describes the whole example rather than half of it.
manuscript_binder = "Writings"
book_folder = "Starforgers"

# ── tags ─────────────────────────────────────────────────────────────────────
# `discoverable` is what puts an item's title and aliases into the mention index and
# the point-of-view picker. A story-bible note without it is invisible to the scan.

[[tag]]
name = "Character"
color = "#4477aa"
discoverable = true
details = "Story-bible entry for a person in the book."

# ── the story bible ──────────────────────────────────────────────────────────
# Its own binder, not notes appended to the manuscript: binders exist to separate the
# book from the material about the book, and burying character notes in the
# manuscript would put them in the analysis scope and in every whole-project export.
# Flat, with no folders — this bible holds people and nothing else.

[bible]
binder = "Story bible"
character_tag = "Character"


