objects = ["La montre de Passepartout", "Le pari"]
synopsis = "Passepartout revient en trombe: le révérend n’est pas libre, car on n’est pas dimanche mais samedi. En marchant vers l’est, les voyageurs ont vu le soleil se lever quatre-vingts fois quatre minutes plus tôt, et gagné un jour entier sans s’en apercevoir — la montre de Passepartout, jamais remise à l’heure, était la seule à le savoir. Fogg court au Reform-Club et y entre à la seconde. Il a gagné son pari sans rien gagner d’autre, sinon une charmante femme, et le bonheur."
